f:{t:'Ladoqa gölü Rusiyadır — 17.700 km²',x:'<strong>Ladoqa gölü</strong> 17.700 km² ilə Avropanın ən böyük gölüdür. Rusiyadır, Sankt-Peterburqun yaxınlığındadır. II Dünya Müharibəsi zamanı "Həyat yolu" — buz üzərindən keçirilən ikmal xətti — bu gölün üstündən keçirdi.',i:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&q=80'}},

{q:'Hansı ölkə ən çox çay içir (adambaşına)?',a:['İngiltərə','Çin','Türkiyə','Hindistan'],c:2,
f:{t:'Türkiyə adambaşına 3,16 kq çay — dünya rekordçusu',x:'<strong>Türkiyə</strong> adambaşına ildə <strong>3,16 kq çay</strong> istehlakı ilə dünya rekordçusudur. Çaydanlıq (iki qatlı) türkiyəlilərin icadıdır. Türk çay mədəniyyəti UNESCO mirası siyahısınadır.',i:'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=900&q=80'}},

{q:'Dünyanın ən böyük bazarı haradır?',a:['Dubay','İstanbul','Tokio','Şanxay'],c:1,
f:{t:'İstanbul Qapalı Çarşısı — 550 ildən çox tarix',x:'İstanbul <strong>Qapalı Çarşısı (Kapalıçarşı)</strong> dünyanın ən böyük örtülü bazarıdır. <strong>550 ildən çox</strong> tarixə malikdir. 4.000-dən çox mağaza, 61 küçə, gündə 250.000-400.000 ziyarətçi.',i:'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=900&q=80'}},

{q:'Hansı ölkənin maşın istehsalı dünyada ən çoxdur?',a:['Yaponiya','ABŞ','Çin','Almaniya'],c:2,
f:{t:'Çin ildə 30 milyon avtomobil — dünyanın yarısı',x:'<strong>Çin</strong> ildə <strong>30 milyondan çox</strong> avtomobil istehsal edir — dünyanın yarısı! 2023-də Çin elektromobil ixracatında da dünya lideri oldu. <strong>BYD, Geely</strong> kimi markalar qlobal bazara çıxıb.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'Dünyada ən çox yeyilən ət hansıdır?',a:['Mal əti','Donuz əti','Toyuq əti','Qoyun əti'],c:1,
f:{t:'Donuz əti dünya ət istehlakının 36%-i',x:'<strong>Donuz əti</strong> dünya ət istehlakının <strong>36%-ini</strong> təşkil edir. Çin dünyanın ən çox donuz əti istehlakçısıdır — ildə <strong>54 milyon ton!</strong> Bu, qalan bütün dünyanın ümumi istehlakına bərabərdir.',i:'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=900&q=80'}},

{q:'"IQ" nəyin qısaltmasıdır?',a:['Intellectual Quality','Intelligence Quotient','Information Quantity','Index Quality'],c:1,
f:{t:'IQ — zəka əmsalı, ortalama 100',x:'IQ = <strong>Intelligence Quotient</strong> (zəka əmsalı). Ortlama IQ <strong>100-dür</strong>. Albert Eynşteynin IQ-sunun 160-180 arasında olduğu iddia edilir. Lakin alimlər qeyd edir: IQ insanın həyatdaki uğurunu tam ölçmür.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Hansı ölkə dünyada ən çox zeytun istehsal edir?',a:['Yunanıstan','İtaliya','İspaniya','Türkiyə'],c:2,
f:{t:'İspaniya dünya zeytun istehsalının 40%-i',x:'<strong>İspaniya</strong> dünya zeytun istehsalının <strong>40%-ini</strong> təmin edir. Ölkənin <strong>340 milyon zeytun ağacı</strong> var! Bəzi ağaclar <strong>1.000 ildən çox yaşlıdır</strong> — hələ zeytun verir.',i:'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=900&q=80'}},

{q:'Hansı heyvan ən çox insana hücum edir (dünyada ölüm sayına görə)?',a:['Aslan','Fil','Ağcaqanad','Köpək'],c:2,
f:{t:'Ağcaqanad ildə 700.000 insan öldürür',x:'<strong>Ağcaqanad</strong> ildə <strong>700.000-dən çox insanı</strong> öldürür — xəstəlik daşıyaraq! Malyariya, denq, Zika virusu vasitəsilə. Aslan isə ildə cəmi 200 nəfər. Ağcaqanad tarihin ən ölümcül heyvanıdır.',i:'https://images.unsplash.com/photo-1474511320723-9a56873867b5?w=900&q=80'}},

{q:'Hansı ölkə 2026-cı ildə FIFA Dünya Çempionatına ev sahibliyi edəcək?',a:['Braziliya','Qatar','ABŞ-Kanada-Meksika','Argentina'],c:2,
f:{t:'2026 — 3 ölkə, 48 komanda, tarixdə ən böyük çempionat',x:'<strong>2026 FIFA Dünya Kuboku</strong> ABŞ, Kanada və Meksikada keçiriləcək — 3 ölkə birlikdə! Bu dəfə iştirakçı komandalar 32-dən <strong>48-ə</strong> çatdırılır. Ən çox oyun oynanacaq dünya çempionatı olacaq.',i:'https://images.unsplash.com/photo-1431324155629-1a6deb1dec8d?w=900&q=80'}},

{q:'Hansı ölkə dünyanın ən çox ixrac edir?',a:['ABŞ','Almaniya','Çin','Yaponiya'],c:2,
f:{t:'Çin 2009-dan bəri dünya ixracatının şampionudur',x:'<strong>Çin</strong> 2009-cu ildən bəri dünyanın ən böyük ixracatçısıdır. İldə <strong>3,5 trilyon dollardan</strong> çox mal ixrac edir. "Dünyanın fabriki" olaraq tanınır.',i:'https://images.unsplash.com/photo-1490457843367-34b21a6e6897?w=900&q=80'}},

{q:'Dünyanın ən böyük mağarası hansıdır?',a:['Mammoth Mağarası','Son Doong','Lechugilla','Krubera'],c:0,
f:{t:'Mammoth mağarası — 676 km yol, hələ kəşf davam edir',x:'<strong>Mammoth Mağarası</strong> (ABŞ, Kentaki) 676 km-dən çox məlum keçidi ilə dünyanın ən uzun mağara sistemidir. Hər il yeni tunellər kəşf edilir. 2-ci dünyada isə Vyetnamdakı <strong>Son Doong</strong>dur — içindəki orman var!',i:'https://images.unsplash.com/photo-1509316785289-025f5b846b35?w=900&q=80'}},

{q:'Yer kürəsinin ümumi səthi neçədir?',a:['310 milyon km²','410 milyon km²','510 milyon km²','610 milyon km²'],c:2,
f:{t:'510 milyon km² — 71% su ilə örtülüdür',x:'Yer kürəsinin ümumi səthi <strong>510 milyon km²-dir</strong>. Bunun <strong>71%-i</strong> su ilə örtülüdür. Bütün quru ərazilər <strong>150 milyon km²-dir</strong> — Sakit okeanın sahəsindən azdır!',i:'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=900&q=80'}},

{q:'Hansı ölkənin bayrağında ulduz yoxdur?',a:['Türkiyə','Braziliya','Yaponiya','ABŞ'],c:2,
f:{t:'Yaponiya bayrağı — "Günəşin ölkəsi", sadə qırmızı dairə',x:'<strong>Yaponiya bayrağı</strong> cəmi ağ fon üzərindəki qırmızı dairədir — ulduz yoxdur. Bu dairə <strong>Günəşi</strong> simvolizə edir. Ən sadə, lakin ən tanınan bayraqlardan biridir.',i:'https://images.unsplash.com/photo-1480796927426-f609979314bd?w=900&q=80'}},

{q:'BMT-nin neçə rəsmi dili var?',a:['4','5','6','7'],c:2,
f:{t:'BMT-nin 6 rəsmi dili: ərəb, çin, fransız, ingilis, rus, ispan',x:'BMT-nin <strong>6 rəsmi dili</strong> var: ərəb, çin (mandarin), fransız, ingilis, rus, ispan. Bu 6 dil dünyada ən geniş danışılan dillər sırasındadır. <strong>193 üzv ölkənin</strong> rəsmi BMT sənədləri bu 6 dildə hazırlanır.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Hansı ölkə "Günəşin batmadığı imperiya" kimi tanınırdı?',a:['Fransa','İspaniya','Böyük Britaniya','Portuqaliya'],c:2,
f:{t:'Britaniya imperiyası — 33,7 milyon km², dünyanın 1/4-ü',x:'<strong>Britaniya imperiyası</strong> XIX əsrin sonunda ən böyük həcminə çatdı — 33,7 milyon km², dünya quru sahəsinin <strong>1/4-ü!</strong> Beləcə günəş imperiyada hər zaman bir yerdə şüalanırdı.',i:'https://images.unsplash.com/photo-1513026705753-bc3fffca8bf4?w=900&q=80'}},

{q:'Sakit okean adı nə üçün bu şəkildə verilmişdir?',a:['Magellanın ona sakit deyə müraciət etməsinə görə','Ən az dalğalı olduğuna görə','Ən mülayim iqlimə görə','Balıqlarının ən sakit olmasına görə'],c:0,
f:{t:'Magellan Sakit okeanı kəşf edəndə səmtə uğurlu düşdü',x:'<strong>Magellan</strong> 1520-ci ildə fırtınalı Kap Horn boğazından keçdikdən sonra bu okanda sakit hava tapdı — adı <strong>"Mar Pacífico"</strong> (Sakit dəniz) qoydu. Əslində Sakit okeanı güclü tufanları ilə məşhurdur!',i:'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=900&q=80'}},

{q:'Birinci Dünya Müharibəsi neçənci ildə başladı?',a:['1912','1913','1914','1915'],c:2,
f:{t:'28 iyun 1914 — bir sui-qəsd dünyaya şər yaratdı',x:'Birinci Dünya Müharibəsi <strong>28 iyun 1914-cü ildə</strong> Arcidük Fransın öldürülməsi ilə başladı. Müharibəyə <strong>30 milyon əsgər</strong> iştirak etdi. Yeni silahlar — zəhərli qaz, tank — ilk dəfə kütləvi istifadə edildi.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Monqol imperiyasını kim qurdu?',a:['Kublay xan','Timur','Çingiz xan','Batu xan'],c:2,
f:{t:'Çingiz xan — ən böyük quru imperiyasının banisi',x:'<strong>Çingiz xan</strong> 1206-cı ildə Monqol imperiyasını qurdu. Nəvəsi Kublay xan dövrünə qədər imperiya <strong>24 milyon km²-ə</strong> çatdı — tarixin ən böyük quru imperiyası!',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Dünyada ilk süni peyki hansı ölkə tərəfindən buraxıldı?',a:['ABŞ','Almaniya','Sovet İttifaqı','Fransa'],c:2,
f:{t:'Sovet İttifaqı 1957-də Sputnik-1 ilə kosmik dövrü açdı',x:'<strong>Sovet İttifaqı</strong> 1957-ci ildə Sputnik-1-i buraxdı. ABŞ bu xəbəri eşidəndə <strong>milli şok</strong> yaşandı. Konqres fövqəladə yığıncaq keçirdi. Bu hadisə NASA-nın yaranmasına və kosmik yarışın başlamasına səbəb oldu.',i:'https://images.unsplash.com/photo-1516849677043-ef67c9557e16?w=900&q=80'}},

{q:'Atatürk Türkiyə Cümhuriyyətini neçənci ildə elan etdi?',a:['1920','1921','1922','1923'],c:3,
f:{t:'29 oktyabr 1923 — müasir Türkiyənin doğum günü',x:'<strong>Mustafa Kamal Atatürk</strong> <strong>29 oktyabr 1923-cü ildə</strong> Türkiyə Cümhuriyyətini elan etdi. Osmanlı imperiyasının 623 illik hakimiyyəti sona çatdı. Atatürk ilk prezident seçildi.',i:'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=900&q=80'}},

{q:'Yaponiya İkinci Dünya Müharibəsindən neçənci ildə çıxdı?',a:['1944','1945','1946','1947'],c:1,
f:{t:'2 sentyabr 1945 — Misuri gəmisindəki təslimçilik',x:'Yaponiya <strong>2 sentyabr 1945-ci ildə</strong> rəsmi olaraq təslim oldu. Atom bombaları Hirosimaya (6 avqust) və Naqasakiyə (9 avqust) atıldıqdan sonra. Təslimçilik sənədi ABŞ USS Missouri gəmisindəki imzalandı.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Böyük İpək Yolu hansı şəhərləri birləşdirirdi?',a:['Çin və Roma','Hindistan və Misir','Ərəbistan və Avropa','Rusiya və Çin'],c:0,
f:{t:'İpək Yolu 7.000 km — mədəniyyətlər körpüsü',x:'Böyük İpək Yolu <strong>Çini Roma ilə</strong> birləşdirirdi. Uzunluğu <strong>7.000 km</strong>-dən çox. Yalnız ipək deyil — xəstəliklər, dinlər, texnologiyalar da bu yolla yayıldı. <strong>Bubonlu vəba</strong> İpək Yolu ilə Avropaya gəldi.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Hansı dövlət dünyanın ilk demokratiyasını yaratdı?',a:['Roma','Yunanıstan-Afina','Misir','Babilon'],c:1,
f:{t:'e.ə. 508 — Afina, Kleisfen, ilk demokratiya',x:'<strong>Afina</strong> e.ə. 508-ci ildə ilk demokratiyanı yaratdı. <strong>Kleisfen</strong> islahatları ilə. Maraqlı: o dövrdə qadınlar, kölələr, xariclilər seçkidə iştirak edə bilmirdi. Yalnız azad Afina kişiləri — bütün əhalinin ~15%-i.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Böyük İsgəndərin müəllimi kim olub?',a:['Sokrat','Platon','Aristotel','Eflatun'],c:2,
f:{t:'Aristotel İsgəndəri 13 yaşından öyrədi',x:'<strong>Aristotel</strong> Makedoniyalı İsgəndərin müəllimi oldu — İsgəndər <strong>13 yaşında</strong> idi. Aristotel ona fəlsəfə, elmlər, incəsənət öyrətdi. İsgəndər ömrü boyu müəllimini ehtiramla xatırladı.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'İkinci Dünya Müharibəsi Avropada hansı tarixdə sona çatdı?',a:['8 may 1945','2 sentyabr 1945','15 avqust 1945','6 iyun 1944'],c:0,
f:{t:'8 may 1945 — V-E günü, Avropada qələbə',x:'Avropada II Dünya Müharibəsi <strong>8 may 1945-ci ildə</strong> — V-E (Victory in Europe) günü — sona çatdı. Almaniyanın qeyd-şərtsiz təslim olması bu günə düşdü. <strong>6 iyun 1944</strong> isə Normandiya desantı — Berlinin yolunu açdı.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Birinci Qarabağ müharibəsi neçənci illərdə baş verdi?',a:['1988-1992','1988-1994','1990-1994','1991-1994'],c:1,
f:{t:'1988-1994 — Birinci Qarabağ müharibəsi',x:'Birinci Qarabağ müharibəsi <strong>1988-1994-cü</strong> illərdə baş verdi. <strong>12 may 1994-cü ildə</strong> Bişkek atəşkəs protokolu imzalandı. 30.000-dən çox azərbaycanlı həyatını itirdi, 1 milyondan çox qaçqın yarandı.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

// ── RİYAZİYYAT + ƏLAVƏ ──
{q:'İkili say sistemində 10 rəqəmi onluq sistemdə nəyə bərabərdir?',a:['2','4','8','10'],c:0,
f:{t:'İkilik sistem — bütün kompüterlərin dili',x:'İkilik sistemdə <strong>10 = onluqda 2.</strong> Bütün kompüterlər yalnız 0 və 1 ilə işləyir — bu ikilik sistemdir. <strong>1 bayt = 8 bit</strong> — 2⁸ = 256 müxtəlif dəyər saxlaya bilər.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'Sahəsi 36 olan kvadratın tərəfi neçədir?',a:['4','5','6','7'],c:2,
f:{t:'Kvadrat kökü — Pifaqorun sevdiyi',x:'36-nın kvadrat kökü = <strong>6</strong>. Pifaqor 6-nı "mükəmməl ədəd" sayırdı: 1+2+3 = 6, 1×2×3 = 6. Riyaziyyatda "mükəmməl ədəd" öz bölənlərinin cəminə bərabər ədəddir.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Hansı ədəd 6-nın faktoriyelidir?',a:['120','720','5040','40320'],c:1,
f:{t:'6! = 720 — 6×5×4×3×2×1',x:'6 faktoriyel = <strong>6×5×4×3×2×1 = 720.</strong> Maraqlı tətbiq: 6 nəfər neçə cür əyləşə bilər? Məhz <strong>720 cür!</strong> Faktoriyel kombinatorikanın əsasıdır.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Trigonometrikada sin²θ + cos²θ nəyə bərabərdir?',a:['0','1','2','θ'],c:1,
f:{t:'sin² + cos² = 1 — Pifaqor trigonometrik kimliyidir',x:'sin²θ + cos²θ = <strong>1</strong> — bu Pifaqorun trigonometrik kimliyidir. Bütün fizika, mühəndislik, kompüter qrafika bu formula üzərindədir. Düz bucaq üçbucağındakı a²+b²=c² ilə birbaşa əlaqəlidir.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Kompleks ədəd i nəyə bərabərdir?',a:['√2','√(-1)','1/2','π/2'],c:1,
f:{t:'i = √(-1) — mümkünsüz kimi görünürdü, amma elektronikaya lazım oldu',x:'<strong>i = √(-1)</strong>. XVIII əsrdə "xəyali ədəd" adlanırdı — mövcud olmadığı düşünülürdü. Lakin bu gün elektrik mühəndisliyi, kvant fizikası, siqnal emalı <strong>kompleks ədədlər olmadan işləyə bilməz!</strong>',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Koordinat həndəsəsinin banisi kim sayılır?',a:['Eyler','Leybnits','Dekart','Qaus'],c:2,
f:{t:'Dekart x-y oxunu yatan mövqedə düşünərkən kəşf etdi',x:'<strong>René Dekart</strong> koordinat sistemini kəşf etdi. Deyilir ki, yataqda tavanı izlərkən milçəyin mövqeyini iki rəqəmlə — x, y — ifadə etməyin mümkün olduğunu anladı. Bu kəşf həndəsəni cəbrlə birləşdirdi.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Hansı riyaziyyatçı "Eyler identikliyini" tapdı?',a:['Qaus','Nyuton','Eyler','Dekart'],c:2,
f:{t:'Eyler — e^(iπ)+1=0, riyaziyyatın ən gözəl düsturu',x:'<strong>Leonhard Eyler</strong> e^(iπ)+1=0 identikliyini kəşf etdi. Bu düsturda riyaziyyatın 5 ən vacib sabiti var: <strong>e, i, π, 1, 0.</strong> Hər dövrdə riyaziyyatçılar onu "ən gözəl düstur" seçir.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Hansı riyaziyyat sahəsi ehtimalları öyrənir?',a:['Cəbr','Həndəsə','Statistika','Ehtimal nəzəriyyəsi'],c:3,
f:{t:'Ehtimal nəzəriyyəsi — kumar oyunlarından doğdu',x:'<strong>Ehtimal nəzəriyyəsi</strong> XVII əsrdə Paskal və Ferma arasındakı məktublaşmada yarandı — ikisi <strong>kumar oyunlarındakı şansı</strong> hesablamaq üçün! Bu gün isə sığorta, maliyyə, süni intellekt əsas sahəsidir.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

// ── MÜSTƏQİL SUALLAR ──
{q:'Dünyada neçə dil var (təxmini)?',a:['1000','3000','7000','10000'],c:2,
f:{t:'7.000 dil — yarısı bu əsrin sonunda yox olacaq',x:'Dünyada <strong>7.000-dən çox dil</strong> var. Dünyanın yarısından çoxu yalnız <strong>23 dillə</strong> danışır. Üzücü fakt: bu dillərin yarısından çoxu bu əsrin sonunda yox olacaq — hər 2 həftədə bir dil ölür.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Hansı dil dünyada ən çox ölkədə rəsmi dildir?',a:['İspan','Fransız','İngilis','Ərəb'],c:2,
f:{t:'İngilis dili 67 ölkədə rəsmi statusa malikdir',x:'<strong>İngilis dili</strong> 67 ölkədə rəsmi statusa malikdir. Britaniya müstəmləkəçiliyinin mirası. Maraqlı: dünyada ingiliscə danışanların yarısından çoxu <strong>ikinci dil kimi öyrənmişdir</strong> — ana dil deyil!',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Hansı dil dünyada ən çox danışılır (ana dil kimi)?',a:['İngilis','İspan','Çin (Mandarin)','Hind'],c:2,
f:{t:'Mandarin 920 milyon ana dil danışanı ilə birincidur',x:'<strong>Çin (Mandarin)</strong> 920 milyondan çox ana dil danışanı ilə birincidir. İngilis dili ana dil baxımından 3-cüdür. Lakin ümumi danışanlar sayına görə ingilis <strong>1,5 milyardla</strong> liderdir.',i:'https://images.unsplash.com/photo-1490457843367-34b21a6e6897?w=900&q=80'}},

{q:'Dünya Sağlamlıq Təşkilatının (WHO) qərargahı haradır?',a:['Nyu York','London','Cenevrə','Paris'],c:2,
f:{t:'WHO Cenevrədədir — 194 üzv ölkə',x:'<strong>WHO</strong>-nun qərargahı İsveçrənin <strong>Cenevrə</strong> şəhərindədir. 194 üzv ölkəsi var. COVID-19 pandemiyasını <strong>11 mart 2020-ci ildə</strong> rəsmi pandemi elan etdi.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Ağ Ev hansı şəhərdədir?',a:['Nyu York','Vaşinqton DC','Boston','Çikaqo'],c:1,
f:{t:'Ağ Ev 1792-dən bəri tikilir — ilk prezident orada yaşamadı',x:'<strong>Ağ Ev Vaşinqton DC-dədir.</strong> 1792-ci ildə inşa başlandı. ABŞ-ın ilk prezidenti Corc Vaşinqton yeganə prezidentdir ki, orada <strong>heç vaxt yaşamadı</strong> — onun dövründə bitmişdi.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'İnsanlığın ən qədim yazı sistemi hansıdır?',a:['Misir heroqlifi','Çin yazısı','Şumer kuneyazısı','Hind yazısı'],c:2,
f:{t:'Şumer kuneyazısı 5.500 il əvvəl gil lövhələrə yazıldı',x:'<strong>Şumer kuneyazısı</strong> e.ə. 3.500-cü ilə aid — dünyanın ən qədim yazı sistemi! Gil lövhəyə sivri alətlə yazılırdı. İlk yazılar əsasən <strong>mühasibat uçotu</strong> idi — nə qədər buğda, qoyun, pivə var.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Nobel mükafatını ilk alan şəxs kimdir? (ədəbiyyat)',a:['Rudyard Kipling','Sully Pryüdom','Anatol Frans','Leonid Andreyev'],c:1,
f:{t:'1901-ci ildə ilk ədəbiyyat Nobeli Sully Prudhom-a verildi',x:'İlk Nobel Ədəbiyyat mükafatı <strong>1901-ci ildə Sully Prudhom-a</strong> verildi. Lakin bu seçim mübahisəli idi — çoxları düşünürdü ki, mükafat <strong>Lev Tolstoya</strong> verilməlidir. Tolstoy heç vaxt Nobel almadı.',i:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=900&q=80'}},

{q:'Hansı klassik musiqiçi kar olmasına baxmayaraq bəstəkarlığa davam etdi?',a:['Moçart','Şopen','Bethoven','Bax'],c:2,
f:{t:'Beethoven — 9-cu simfoniyasını eshitmədi, amma yazdı',x:'<strong>Ludwig van Beethoven</strong> 9-cu simfoniyasını tam kar olduğu 1824-ci ildə bəstədi. Premyerada tamaşaçıların alqışını eşitmədi. Kiminsə onu <strong>çevirməsi lazım gəldi</strong> — görsün ki sevinclər var.',i:'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=900&q=80'}},
