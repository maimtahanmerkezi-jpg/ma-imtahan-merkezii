
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Biliyin Milyon Dəyər — MA İmtahan Mərkəzi</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f5ff;color:#0a1e50;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.bg1{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(24,82,240,0.12)0%,transparent 70%);top:-200px;right:-150px;pointer-events:none;z-index:0}
.bg2{position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(24,82,240,0.08)0%,transparent 70%);bottom:-150px;left:-100px;pointer-events:none;z-index:0}
.wrap{width:100%;max-width:720px;padding:24px 16px;position:relative;z-index:1}
#startScreen{text-align:center;padding:40px 20px}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(24,82,240,0.1);border:1px solid rgba(24,82,240,0.3);color:#1852f0;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:7px 18px;border-radius:100px;margin-bottom:20px}
.game-title{font-size:clamp(32px,7vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px;color:#0a1e50}
.blue{color:#1852f0}.amber{color:#f5a623}
.game-sub{font-size:15px;font-weight:300;color:rgba(10,30,80,0.55);margin-bottom:8px}
.q-count-badge{display:inline-block;background:rgba(24,82,240,0.08);border:1px solid rgba(24,82,240,0.2);color:#1852f0;font-size:12px;font-weight:600;padding:5px 14px;border-radius:100px;margin-bottom:28px}
.start-btn{height:54px;padding:0 48px;background:#1852f0;border:none;border-radius:14px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;transition:background .2s,transform .15s;box-shadow:0 4px 28px rgba(24,82,240,0.3)}
.start-btn:hover{background:#2d6aff;transform:translateY(-2px)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.chip{background:rgba(24,82,240,0.06);border:1px solid rgba(24,82,240,0.15);color:rgba(10,30,80,0.65);font-size:12px;padding:7px 15px;border-radius:100px}
.pool-info{font-size:11px;color:rgba(10,30,80,0.3);margin-top:10px}
#gameScreen{display:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px}
.tb-logo{font-size:13px;font-weight:700;color:#1852f0}
.tb-info{font-size:12px;color:rgba(10,30,80,0.45)}
.progress-wrap{width:100%;height:4px;background:rgba(24,82,240,0.12);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:#1852f0;border-radius:2px;transition:width .5s ease}
.timer-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.timer-label{font-size:12px;font-weight:600;color:rgba(10,30,80,0.45);flex-shrink:0}
.timer-bar-wrap{flex:1;height:8px;background:rgba(24,82,240,0.1);border-radius:4px;overflow:hidden}
.timer-bar-fill{height:100%;border-radius:4px;transition:width .95s linear,background .3s}
.timer-count{font-size:15px;font-weight:800;min-width:32px;text-align:right;color:#1852f0;flex-shrink:0;transition:color .3s}
.timer-count.warning{color:#f5a623}.timer-count.danger{color:#e53e3e}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;margin-bottom:16px}
.l-row{display:flex;align-items:center;gap:10px;padding:5px 12px;border-radius:8px;border:1px solid transparent;transition:all .3s}
.l-row.active{background:rgba(24,82,240,0.1);border-color:rgba(24,82,240,0.4)}
.l-row.done{background:rgba(52,211,99,0.08);border-color:rgba(52,211,99,0.25)}
.l-num{font-size:11px;font-weight:700;color:rgba(10,30,80,0.25);width:20px;text-align:right}
.l-row.active .l-num{color:#1852f0}.l-row.done .l-num{color:#16a34a}
.l-label{font-size:12px;color:rgba(10,30,80,0.3)}
.l-row.active .l-label{color:#0a1e50;font-weight:700}.l-row.done .l-label{color:#16a34a}
.l-time{font-size:10px;font-weight:600;color:rgba(24,82,240,0.5);margin-left:auto;flex-shrink:0}
.q-box{background:#fff;border:1.5px solid rgba(24,82,240,0.2);border-radius:16px;padding:24px 22px;margin-bottom:14px;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 16px rgba(24,82,240,0.08)}
.q-text{font-size:clamp(15px,3vw,18px);font-weight:600;line-height:1.6;color:#0a1e50}
.jokers{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.joker-btn{height:36px;padding:0 18px;background:#fff;border:1.5px solid rgba(24,82,240,0.25);border-radius:100px;font-size:12px;font-weight:600;color:#1852f0;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s}
.joker-btn:hover:not([disabled]){background:#1852f0;color:#fff;border-color:#1852f0}
.joker-btn[disabled]{opacity:.3;cursor:not-allowed}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.ans-btn{background:#fff;border:1.5px solid rgba(24,82,240,0.15);border-radius:12px;padding:14px;font-size:clamp(13px,2.5vw,15px);font-weight:500;color:#0a1e50;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;text-align:left;line-height:1.45;display:flex;align-items:flex-start;gap:8px;box-shadow:0 1px 6px rgba(24,82,240,0.06)}
.ans-btn:hover:not([disabled]):not(.hidden){background:#e8f0ff;border-color:#1852f0;transform:translateY(-1px)}
.ans-btn.correct{background:rgba(22,163,74,0.12)!important;border-color:#16a34a!important;color:#15803d!important}
.ans-btn.wrong{background:rgba(220,38,38,0.08)!important;border-color:#dc2626!important;color:#b91c1c!important}
.ans-btn.hidden{opacity:.15;pointer-events:none}
.ans-btn[disabled]{cursor:default}
.ans-letter{font-size:11px;font-weight:800;color:#1852f0;flex-shrink:0;margin-top:2px;min-width:14px}
.ans-btn.correct .ans-letter{color:#16a34a}.ans-btn.wrong .ans-letter{color:#dc2626}
.fo{position:fixed;inset:0;z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(4,10,36,0.85);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .38s ease}
.fo.on{opacity:1;pointer-events:all}
.fc{width:100%;max-width:500px;border-radius:22px;overflow:hidden;box-shadow:0 40px 100px rgba(4,10,36,0.6);transform:scale(0.9) translateY(24px);transition:transform .44s cubic-bezier(.34,1.45,.64,1)}
.fo.on .fc{transform:scale(1) translateY(0)}
.fc-img{position:relative;width:100%;height:220px;background:#0a1830;overflow:hidden}
.fc-img img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.08);transition:transform 7s ease}
.fo.on .fc-img img{transform:scale(1)}
.fc-img::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,10,36,0.5) 0%,transparent 35%),linear-gradient(0deg,rgba(4,10,36,0.92) 0%,rgba(4,10,36,0.55) 40%,transparent 70%)}
.fc-tag{position:absolute;top:14px;left:14px;z-index:2;display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);backdrop-filter:blur(6px);color:#fff;font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;padding:5px 12px;border-radius:100px}
.fc-title{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:0 20px 20px;color:#fff;font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.02em}
.fc-body{background:#fff;padding:16px 20px 20px}
.fc-accent{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.fc-dot{width:5px;height:5px;border-radius:50%;background:#1852f0;flex-shrink:0}
.fc-line{flex:1;height:1px;background:rgba(10,30,80,0.08)}
.fc-text{font-size:13.5px;font-weight:400;color:rgba(10,30,80,0.68);line-height:1.75;margin-bottom:16px}
.fc-text b,.fc-text strong{color:#0a1e50;font-weight:700}
.fc-btn{width:100%;height:48px;background:#1852f0;border:none;border-radius:13px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .18s,transform .15s}
.fc-btn:hover{background:#2d6aff;transform:translateY(-2px)}
.fc-btn svg{transition:transform .2s}.fc-btn:hover svg{transform:translateX(4px)}
#endScreen{display:none;text-align:center;padding:40px 20px}
.end-emoji{font-size:64px;margin-bottom:16px}
.end-title{font-size:30px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;color:#0a1e50}
.end-score{font-size:16px;color:rgba(10,30,80,0.5);margin-bottom:12px;font-weight:300}
.end-msg{font-size:14px;color:rgba(10,30,80,0.45);margin-bottom:32px;line-height:1.7;max-width:360px;margin-left:auto;margin-right:auto}
.end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wa-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 26px;background:#25d366;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;text-decoration:none;transition:transform .15s}
.wa-btn:hover{transform:translateY(-2px)}
.again-btn{height:48px;padding:0 26px;background:#fff;border:1.5px solid rgba(24,82,240,0.25);border-radius:12px;font-size:14px;font-weight:600;color:#1852f0;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s}
.again-btn:hover{background:#1852f0;color:#fff}
</style>
</head>
<body>
<div class="bg1"></div><div class="bg2"></div>
<div class="wrap">
<div id="startScreen">
  <div class="logo-badge">MA İmtahan Mərkəzi</div>
  <div class="game-title">Biliyin<br><span class="blue">Milyon</span> <span class="amber">Dəyər</span></div>
  <div class="game-sub">Dünyagörüş sualları · 12 mərhələ · 3 joker</div>
  <div class="q-count-badge">900+ sual bazası — hər oyun tamamilə fərqlidir!</div>

  <div class="end-msg" id="endMsg"></div>

</div>

<script>
var ALL_QUESTIONS=[
// ── COĞRAFİYA ──
{q:'Yer kürəsinin ən böyük okeanı hansıdır?',a:['Atlantik','Sakit okean','Hind','Şimal Buz'],c:1,
f:{t:'Sakit okean bütün qurulardan böyükdür',x:'<strong>Sakit okean</strong> 165 milyon km² sahəsi ilə Yerin bütün quru ərazilərini üstələyir. Ən dərin nöqtəsi <strong>Mariana çuxuru</strong> — 10.994 m. Adını isə Magellanın ona sakit dəniz tapması səbəbindən almışdır.',i:'https://images.unsplash.com/photo-1505118380757-91f5f5632de0?w=900&q=80'}},

{q:'Dünyanın ən uzun çayı hansıdır?',a:['Amazon','Nil','Yanszı','Missisipi'],c:1,
f:{t:'Nil çayı 6.650 km — 11 ölkədən axır',x:'<strong>Nil</strong> 6.650 km ilə dünyanın ən uzun çayıdır. Etiopiya, Sudan, Misir daxil <strong>11 ölkədən</strong> keçir. Qədim Misir sivilizasiyasının bütün inkişafı məhz bu çayın sahillərindən başladı.',i:'https://images.unsplash.com/photo-1609619385002-f40f1df9b7eb?w=900&q=80'}},

{q:'Avropanın ən böyük ölkəsi hansıdır?',a:['Fransa','Almaniya','Rusiya','Ukrayna'],c:2,
f:{t:'Rusiya 11 vaxt qurşağını əhatə edir',x:'Rusiya <strong>17,1 milyon km²</strong> ilə həm Avropanın, həm dünyanın ən böyük ölkəsidir. Şərqdən qərbə qədər <strong>11 vaxt qurşağı</strong> uzanır — bir ucunda sübh olanda digər ucunda gecədir!',i:'https://images.unsplash.com/photo-1513326738677-b964603b136d?w=900&q=80'}},

{q:'Dünyanın ən böyük ölkəsi (ərazi baxımından) hansıdır?',a:['Kanada','Çin','ABŞ','Rusiya'],c:3,
f:{t:'Rusiya Pluton planetinin diametrindən böyükdür',x:'Rusiya o qədər böyükdür ki, <strong>Pluton planetinin diametrindən</strong> belə genişdir! Ölkənin şərqindən qərbinə qədər təyyarə ilə <strong>10 saat</strong> uçmaq lazımdır.',i:'https://images.unsplash.com/photo-1513326738677-b964603b136d?w=900&q=80'}},

{q:'Hansı ölkə ən çox əhaliyə malikdir?',a:['Hindistan','Çin','ABŞ','İndoneziya'],c:0,
f:{t:'2023-dən Hindistan dünya əhali şampionudur',x:'<strong>2023-cü ildən</strong> Hindistan 1,44 milyard nəfərlə Çini geridə qoyaraq dünyanın ən çox əhalili ölkəsi oldu. Maraqlı fakt: Hindistanın əhalisinin <strong>yarıdan çoxu 30 yaşın altındadır!</strong>',i:'https://images.unsplash.com/photo-1524492412937-b28074a5d7da?w=900&q=80'}},

{q:'Dünyanın ən böyük səhrası hansıdır?',a:['Saxara','Qobi','Ərəbistan','Antarktida'],c:3,
f:{t:'Ən böyük səhra Saxara deyil — Antarktidadır!',x:'Şok həqiqət: <strong>ən böyük səhra Antarktidadır!</strong> Səhra tərifi ildə 250 mm-dən az yağıntı düşən yerdir. Antarktidada ildə cəmi <strong>50 mm</strong> yağıntı düşür — 14 milyon km² isti olmayan səhra!',i:'https://images.unsplash.com/photo-1529400971008-f566de0e6dfc?w=900&q=80'}},

{q:'Ən uzun dağ silsiləsi hansıdır?',a:['Himalay','And dağları','Alp dağları','Ural dağları'],c:1,
f:{t:'And dağları 7.200 km — 7 ölkədən keçir',x:'<strong>And dağları</strong> 7.200 km uzunluğu ilə dünyanın ən uzun dağ silsiləsidir. Cənubi Amerikanın <strong>7 ölkəsindən</strong> keçir. Ən hündür zirvəsi Akkonkaqua — <strong>6.961 m</strong>.',i:'https://images.unsplash.com/photo-1526392060635-9d6019884377?w=900&q=80'}},

{q:'Atlantik okeanındakı ən böyük ada hansıdır?',a:['İslandiya','İrlandiya','Böyük Britaniya','Qrenlandiya'],c:3,
f:{t:'Qrenlandiya — dünyanın ən böyük adası',x:'<strong>Qrenlandiya</strong> 2,166 milyon km² ilə dünyanın ən böyük adasıdır. Amma əhalisinin sayı cəmi <strong>56.000 nəfərdir!</strong> Buzları əriyərsə, dünya dəniz səviyyəsi <strong>7 metr qalxar.</strong>',i:'https://images.unsplash.com/photo-1531366936337-7c912a4589a7?w=900&q=80'}},

{q:'Dünyanın ən dərin gölü hansıdır?',a:['Xəzər','Baykal','Tanqanika','Viktoriya'],c:1,
f:{t:'Baykal gölü 25 milyon yaşındadır',x:'<strong>Baykal</strong> 1.642 m dərinliyi ilə dünyanın ən dərin gölüdür. Yaşı <strong>25 milyon ildir</strong> — dünyada ən qədim gördür. Dünya şirin suyunun <strong>20%-ni</strong> tək bu göl saxlayır!',i:'https://images.unsplash.com/photo-1551632811-561732d1e306?w=900&q=80'}},

{q:'Ən çox ölkə ilə həmsərhəd olan ölkə hansıdır?',a:['Rusiya','Çin','Braziliya','Almaniya'],c:0,
f:{t:'Rusiya VƏ Çin hər ikisi 14 ölkə ilə həmsərhəddir',x:'Maraqlıdır — <strong>Rusiya da, Çin də</strong> hər biri 14 ölkə ilə həmsərhəddir, bərabərlik! Bununla belə, Rusiyanın ümumi həmsərhəd xəttinin uzunluğu <strong>60.000 km</strong>-dən çoxdur.',i:'https://images.unsplash.com/photo-1490077476659-095159692ab5?w=900&q=80'}},

{q:'Azərbaycanın ən böyük şəhəri hansıdır?',a:['Gəncə','Sumqayıt','Bakı','Naxçıvan'],c:2,

{q:'Hansı element Günəşdə ən bol miqdarda vardır?',a:['Oksigen','Helium','Hidrogen','Karbon'],c:2,
f:{t:'Günəş hər saniyə 600 milyon ton hidrogeni yandırır',x:'Günəşin <strong>73%-i hidrogendən</strong> ibarətdir. Hər saniyə <strong>600 milyon ton</strong> hidrogeni heluma çeviririr — nüvə sintezi! Bu proses daha <strong>5 milyard il</strong> davam edəcək.',i:'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=900&q=80'}},

{q:'İnsan ürəyi gündə təxminən neçə dəfə döyünür?',a:['50.000','100.000','200.000','30.000'],c:1,
f:{t:'İnsan ürəyi həyatı boyunca 2,5 milyard dəfə döyünür',x:'İnsan ürəyi gündə <strong>100.000 dəfə</strong> döyünür. Ömür boyu bu <strong>2,5 milyard döyüntüdür!</strong> Ürək qanı saniyədə 1,4 litr sürətlə vurur. Həyatı boyunca bir insan ürəyi <strong>40 milyon litr</strong> qan vurur.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Dünyada ən çox istehsal olunan metal hansıdır?',a:['Alüminium','Mis','Dəmir','Sink'],c:2,
f:{t:'Dəmir Yer kürəsinin mərkəzini əmələ gətirir',x:'<strong>Dəmir</strong> həm ən çox istehsal olunan metal, həm də <strong>Yer kürəsinin mərkəzini</strong> (nüvəsini) əmələ gətirir. Hər il <strong>1,9 milyard ton polad</strong> istehsal edilir. Maqnitlərin işləməsini dəmir sağlayır.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Səsin sürəti havada təxminən neçə m/s-dir?',a:['150','343','500','700'],c:1,
f:{t:'İşıq səsdən 880.000 dəfə sürətlidir',x:'Səs havada saniyədə <strong>343 m</strong> sürətlə yayılır. <strong>İşıq isə səsdən 880.000 dəfə sürətlidir!</strong> Buna görə ildırım çaxanda öncə şimşəyi görür, sonra səsi eşidirik.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'İnsan bədəninin ən böyük orqanı hansıdır?',a:['Qaraciyər','Ağ ciyər','Dəri','Beyin'],c:2,
f:{t:'Dəri hər 2-4 həftədə tam yenilənir',x:'<strong>Dəri</strong> 1,5-2 m² ilə insan bədəninin ən böyük orqanıdır! Hər <strong>2-4 həftədə</strong> tam yenilənir. İnsan ömrü boyunca orta hesabla <strong>48 kq dəri tökür!</strong> Həmçinin D vitaminini sintez edir.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Ağ işıq neçə rəngdən ibarətdir?',a:['3','5','7','9'],c:2,
f:{t:'Nyuton 1666-da prizma ilə 7 rəngi kəşf etdi',x:'Ağ işıq <strong>7 rəngdən</strong> ibarətdir. <strong>İsaak Nyuton</strong> 1666-cı ildə prizma ilə gün işığını parçalayaraq bunu kəşf etdi. Maraqlı fakt: həmin il taun xəstəliyi ucbatından evdə gizləndiyindən bu sınağı apardı.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Hansı qaz atmosferdə ən çox miqdarda vardır?',a:['Oksigen','Azot','Karbon dioksid','Arqon'],c:1,
f:{t:'Azot atmosferin 78%-i — nə alışır, nə söndürür',x:'<strong>Azot</strong> atmosferin 78%-ni təşkil edir, oksigen isə 21%-ni. Azot kimyəvi cəhətdən passivdir — <strong>nə alışır, nə başqalarının alışmasına kömək edir.</strong> Onsuz atmosfer yanardı!',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Qanın hansı hissəsi oksigen daşıyır?',a:['Leykositlər','Trombositlər','Eritrositlər','Plazma'],c:2,
f:{t:'1 damla qanda 5 milyon eritrosit var',x:'<strong>Eritrositlər</strong> (qırmızı qan cisimcikləri) oksigen daşıyır. 1 ml qanda <strong>5 milyon eritrosit</strong> var! Hər eritrositin ömrü 120 gündür — sonra dalaq onu parçalayır.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Hansı vitamin günəş işığından alınır?',a:['A vitamini','B vitamini','C vitamini','D vitamini'],c:3,
f:{t:'D vitamini çatışmazlığı 1 milyard insanı əhatə edir',x:'<strong>D vitamini</strong> dəridə günəş ultrabənövşəyi şüaları sayəsində sintez edilir. Dünyada <strong>1 milyard nəfər</strong> D vitamini çatışmazlığından əziyyət çəkir. Sümük sağlamlığı, immunitet üçün vacibdir.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Fotosintez zamanı bitkilər hansı qazı udur?',a:['Oksigen','Azot','Karbon dioksid','Hidrogen'],c:2,
f:{t:'Fotosintez bütün həyatın əsasıdır',x:'Bitkilər <strong>CO₂ + H₂O + işıq → qlükoza + O₂</strong> reaksiyasını həyata keçirir. Bütün atmosferimizdəki oksigen <strong>milyardlarla ildir davam edən fotosintezidir!</strong> Bu olmadan nə heyvan, nə insan mövcud ola bilərdi.',i:'https://images.unsplash.com/photo-1628595351029-c2bf17511435?w=900&q=80'}},

{q:'İnsan beyninin kütləsi təxminən neçə qramdır?',a:['500','1400','2000','800'],c:1,
f:{t:'Beyin bədənin 2%-i, enerjinin 20%-ni istehlak edir',x:'İnsan beyni <strong>1.400 qramdır</strong>, lakin bədənin istehlak etdiyi enerjinin <strong>20%-ni</strong> tək başına alar! 100 milyard neyron var. Uykuda da fəal olmaqda davam edir — yuxu zamanı yaddaş formalaşır.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Qan qrupları neçə növdür (ABO sistemi)?',a:['2','3','4','5'],c:2,
f:{t:'Karl Landşteyner qan qruplarını kəşf edib Nobel aldı',x:'ABO sisteminə görə <strong>4 qan qrupu</strong> var: A, B, AB, O. <strong>Karl Landşteyner</strong> 1901-ci ildə kəşf etdi — 1930-da Nobel aldı. Bundan əvvəl qan köçürmələr çox vaxt ölümlə nəticələnirdi!',i:'https://images.unsplash.com/photo-1579154204601-01588f351e67?w=900&q=80'}},

{q:'Atom nüvəsini kəşf edən kim olmuşdur?',a:['Niels Bor','Ernest Rezerford','Marie Küri','Cozef Tomson'],c:1,
f:{t:'Rezerford qızıl folqaya alfa şüaları atdı',x:'<strong>Ernest Rezerford</strong> 1911-ci ildə qızıl folqaya alfa hissəcikləri atdı. Bəzilərinin geri qayıtması onu şoka saldı — <strong>atom nüvəsini kəşf etmişdi!</strong> Özü bunu "divan arxasından top atıb divanın üstünə düşməsinə" bənzətdi.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Elektronu kəşf edən kim olmuşdur?',a:['Albert Eynşteyn','Niels Bor','Cozef Tomson','Ernest Rezerford'],c:2,
f:{t:'Cozef Tomson 1897-də elektronu kəşf etdi',x:'<strong>Cozef Tomson</strong> 1897-ci ildə katod şüaları sınağı ilə elektronu kəşf etdi. 1906-da Nobel aldı. Maraqlı fakt: onun oğlu Corc Tomson da Nobel aldı — <strong>elektronu dalğa kimi davranması üçün!</strong>',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Hansı element otaq temperaturunda maye halındadır?',a:['Qurğuşun','Civə','Qalay','Sink'],c:1,
f:{t:'Civə zəhərlidir, amma termometrlər üçün mükəmməldir',x:'<strong>Civə</strong> otaq temperaturunda maye halında olan yeganə metaldır. Donma nöqtəsi <strong>-38,8°C</strong>. Son dərəcə zəhərlidir — bu gün tibb termometrlərindən çıxarılmışdır. Qlükoza sözünün kökü olan <strong>Merkuri</strong> planeti onun adını daşıyır.',i:'https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=900&q=80'}},

{q:'Günəş sistemindəki planetlərin sayı neçədir?',a:['7','8','9','10'],c:1,
f:{t:'Pluton 2006-dan cırtdan planet sayılır',x:'Günəş sistemindəki planetlərin sayı rəsmi olaraq <strong>8-dir</strong>. Pluton 2006-cı ildə planetlər siyahısından çıxarıldı — indi <strong>"cırtdan planet"</strong> adlanır. Buna görə astronomlar arasında böyük mübahisə yarandı!',i:'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=900&q=80'}},

{q:'Qızıl elementinin kimyəvi simvolu nədir?',a:['Gl','Go','Au','Gd'],c:2,
f:{t:'Au — Aurum — 1 qramdan 3 km məftil çəkmək olar',x:'Qızılın simvolu <strong>Au</strong> — latınca "aurum". 1 qram qızıldan <strong>3 km uzunluğunda</strong> nazik məftil çəkə bilərsiniz! Qızıl paslanmır, korroziyaya uğramır — buna görə kosmos texnologiyalarında geniş istifadə edilir.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Hansı element ən yüngüldür?',a:['Helium','Hidrogen','Litium','Bor'],c:1,
f:{t:'Hidrogen kainatın 75%-ini təşkil edir',x:'<strong>Hidrogen</strong> ən yüngül elementdir — atomik nömrəsi 1. Kainatın <strong>75%-i hidrogendən</strong> ibarətdir. Günəş kimi bütün ulduzlar hidrogeni heluma çevirərək enerji istehsal edir.',i:'https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=900&q=80'}},

{q:'DNA-nın ikiqat spiral quruluşunu kim kəşf etdi?',a:['Darvin','Kriq və Uotson','Mendel','Pastör'],c:1,
f:{t:'Rozalind Franklinin şəkli olmadan DNA kəşf edilə bilməzdi',x:'<strong>Frensis Kriq və Ceyms Uotson</strong> 1953-cü ildə DNT spiralını kəşf etdi. Lakin həlledici ipucu <strong>Rozalind Franklinin</strong> çəkdiyi X-şüa şəkli idi. O, Nobel mükafatından məhrum qaldı — qadın olduğu üçün adı uzun illər unuduldu.',i:'https://images.unsplash.com/photo-1628595351029-c2bf17511435?w=900&q=80'}},

{q:'İnsan bədənindəki ən kiçik sümük haradır?',a:['Barmaqda','Ayaqda','Qulaqda','Gözün yanında'],c:2,
f:{t:'Üzəngicik sümüyü cəmi 3 mm — eşitmənin açarı',x:'İnsan bədəninin ən kiçik sümüyü qulaqda yerləşən <strong>üzəngicikdir</strong> — uzunluğu cəmi <strong>3 mm!</strong> Orta qulaqda malleus, inkus, stapes (üzəngicik) adlı üç kiçik sümük var. Bunlar səs titrəyişlərini iç qulağa ötürür.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Yer kürəsi öz oxu ətrafında tam bir dönüşü neçə saata edir?',a:['23 saat','24 saat','23 saat 56 dəqiqə','25 saat'],c:2,
f:{t:'Günümüz 24 saatdır, amma Yerin tam dönüşü 23:56-dır',x:'Yer öz oxu ətrafında tam dönüşünü <strong>23 saat 56 dəqiqə 4 saniyəyə</strong> edir. "24 saat" isə Günəşə görə ölçülür. Bu <strong>4 dəqiqəlik fərq</strong> ulduzların hər gecə bir az fərqli yerdə görünməsinə səbəb olur.',i:'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=900&q=80'}},

{q:'Hansı vitamin qanın laxtalanmasında iştirak edir?',a:['A vitamini','C vitamini','D vitamini','K vitamini'],c:3,
f:{t:'K vitamini — adı almanicada "koaqulasiya"dan gəlir',x:'<strong>K vitamini</strong> qanın laxtalanmasını sağlayır. "K" hərfi almanicadan gəlir — <strong>"Koagulation"</strong> (laxtalanma). Yosun, ispanaq, kəvər K vitamini ilə zəngindir. Çatışmazlıqda kiçik kəsilərdən belə qan dayanmır.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Göy qurşağında neçə rəng var?',a:['5','6','7','8'],c:2,
f:{t:'İkiqat göy qurşağında rənglər tərsinə düzülür',x:'Göy qurşağında <strong>7 rəng</strong> var. İkili göy qurşağında isə <strong>rənglər tərsinə düzülür</strong> — qırmızı içdə, bənövşəyi kənarda! Göy qurşağı əslində tam dairədir — bizdən ancaq yarısı görünür.',i:'https://images.unsplash.com/photo-1502082553048-f009c37129b9?w=900&q=80'}},

{q:'Nisbiyyət nəzəriyyəsini kim irəli sürdü?',a:['Nyuton','Eynşteyn','Bor','Faradey'],c:1,
f:{t:'Eynşteyn 26 yaşında 4 tarixi məqalə yazdı',x:'<strong>Albert Eynşteyn</strong> 1905-ci ildə — cəmi 26 yaşında — 4 tarixi elmi məqalə yazdı. Bu il "möcüzəli il" adlanır. E=mc² formulası <strong>atom enerjisinin əsasını</strong> qoydu.',i:'https://images.unsplash.com/photo-1614314107768-6018061b5b72?w=900&q=80'}},

{q:'Penisilin antibiotikini kim kəşf etdi?',a:['Lui Paster','Aleksandr Fleminq','Robert Kox','Cozef Lister'],c:1,
f:{t:'Fleminq tətilə gedib laboratoriyasını unuddu — milyardlar xilas oldu',x:'<strong>Aleksandr Fleminq</strong> 1928-ci ildə tətilə getməmişdən əvvəl petri qabını yığışdırmadı. Qayıdanda gördü ki, küf göbələyi bakteriyaları <strong>məhv etmişdir</strong>. Bu qəza sayəsində <strong>milyardlarla həyat xilas oldu!</strong>',i:'https://images.unsplash.com/photo-1579154204601-01588f351e67?w=900&q=80'}},

{q:'Telefonu kim ixtira etdi?',a:['Tomas Edison','Qram Bell','Nikola Tesla','Marko Poni'],c:1,
f:{t:'Qraham Bell telefonu 1876-da patentləşdirdi, amma...',x:'<strong>Aleksandr Qraham Bell</strong> 1876-cı ildə patent aldı. Lakin <strong>Antonio Meuçi</strong> daha əvvəl ixtira etmişdi — kasıblıq üzündən patent ödənişini verə bilmirdi. 2002-ci ildə ABŞ Konqresi rəsmi olaraq Meuçinin haqqını tanıdı.',i:'https://images.unsplash.com/photo-1523206489230-c012c64b2b48?w=900&q=80'}},

{q:'Cazibə qüvvəsi qanununu kim kəşf etdi?',a:['Galiley','Kopernik','Nyuton','Eynşteyn'],c:2,
f:{t:'Nyutonun tərəfi ola bilsin — amma alma əfsanəsi doğrumudur?',x:'<strong>İsaak Nyuton</strong> 1687-ci ildə cazibə qanununu kəşf etdi. Alma ağacı əfsanəsi <strong>qismən doğrudur</strong> — Nyuton özü bu hekayəni dostlarına danışıb. 300 il sonra bu qanun kosmik gəmilərin traektoriyasını hesablamaqda istifadə edilir.',i:'https://images.unsplash.com/photo-1620641788421-7a1c342ea42e?w=900&q=80'}},

{q:'Radium elementini kim kəşf etdi?',a:['Röngen','Küri cütlüyü','Bekkrel','Rezerford'],c:1,
f:{t:'Mariya Kürinin dəftərləri hələ radioaktivdir',x:'<strong>Mariya və Pyer Küri</strong> 1898-ci ildə Radium elementini kəşf etdi. Mariya Kürinin dəftərləri o qədər radioaktivdir ki, Paris arxivlərində <strong>xüsusi şüşə qutu</strong>da saxlanılır. Onları görmək üçün hələ sənəd lazımdır!',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Elektrik lambasını kim ixtira etdi?',a:['Nikola Tesla','Qram Bell','Tomas Edison','Volta'],c:2,
f:{t:'Edison 1.000-dən çox sınaqdan sonra uğur qazandı',x:'<strong>Tomas Edison</strong> 1879-cu ildə işlənən elektrik lambasını hazırladı. Deyilənə görə <strong>1.000-dən çox</strong> sınaq apardı. "Mən uğursuz olmadım — sadəcə işləməyən 1.000 üsul tapdım" dedi.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'Evolyusiya nəzəriyyəsini kim irəli sürdü?',a:['Lamark','Darvin','Mendel','Linn'],c:1,
f:{t:'Darvin kitabı yazmaq üçün 20 il gözlədi',x:'<strong>Çarlz Darvin</strong> evolyusiya nəzəriyyəsini 1838-ci ildə kəşf etdi, lakin kitabı nəşr etmək üçün <strong>20 il gözlədi</strong> — din adamlarının reaksiyasından qorxurdu. "Növlərin Mənşəyi" 1859-da çıxdı.',i:'https://images.unsplash.com/photo-1591737902471-1bb2dc5dc3c3?w=900&q=80'}},

{q:'Buxar mühərrikini kim ixtira etdi?',a:['Ceyms Uatt','Tomas Edison','Jorj Stefenson','Robert Fulton'],c:0,
f:{t:'Ceyms Uatt — "Vatt" güc vahidi onun adındandır',x:'<strong>Ceyms Uatt</strong> 1769-cu ildə buxar mühərrikini əhəmiyyətli dərəcədə təkmilləşdirdi. Güc vahidi <strong>"watt"</strong> onun şərəfinə adlandırılıb. Bu ixtira Sənaye İnqilabının başlanğıcını verdi — dünya üzü dəyişdi.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'Mariya Küri iki Nobel mükafatı hansı elm sahələrindən almışdır?',a:['Fizika və kimya','Kimya və biologiya','Fizika və tibb','Kimya və tibb'],c:0,
f:{t:'Mariya Küri iki fərqli sahədən Nobel alan yeganə şəxsdir',x:'<strong>Mariya Küri</strong> 1903-də Fizika, 1911-də Kimya Nobelini aldı. <strong>İki fərqli elm sahəsindən Nobel alan yeganə şəxsdir</strong>. Üstəlik o dövrdə qadınlara universitet girişi çox məhdud idi!',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Periodlar cədvəlini kim hazırlamışdır?',a:['Lavoze','Mendeleyev','Berzeli','Dalton'],c:1,
f:{t:'Mendeleyev hələ kəşf edilməmiş elementləri öncədən proqnozlaşdırdı',x:'<strong>Dmitri Mendeleyev</strong> 1869-cu ildə periodlar cədvəlini yaratdı. Əfsanəyə görə yuxuda gördü! Ən fantastik fakt: hələ kəşf edilməmiş <strong>3 elementin</strong> xassələrini öncədən proqnozlaşdırdı — hamısı sonradan doğru çıxdı.',i:'https://images.unsplash.com/photo-1507413245164-6160d8298b31?w=900&q=80'}},

{q:'Tibb elminin atası kim sayılır?',a:['İbn Sina','Hippokrat','Qalen','Parakels'],c:1,
f:{t:'Hippokrat andı 2.400 il sonra hələ oxunur',x:'<strong>Hippokrat</strong> (e.ə. 460-370) tibb elminin atasıdır. Müəyyən etdiyi Hippokrat andı bu gün tibb məzunları tərəfindən <strong>hələ oxunur!</strong> "Birinci zərər vermə" (primum non nocere) onun əsas prinsipidir.',i:'https://images.unsplash.com/photo-1579154204601-01588f351e67?w=900&q=80'}},

{q:'Rentgen şüalarını kim kəşf etdi?',a:['Küri','Röngen','Bekkerel','Rezerford'],c:1,
f:{t:'Röngen ilk Nobel mükafatçısıdır — patentsiz!',x:'<strong>Vilhelm Röngen</strong> 1895-ci ildə rentgen şüalarını kəşf etdi. Birinci Nobel Fizika mükafatını aldı (1901). Ən şərəfli hərəkəti: <strong>patent almadı, puldan imtina etdi</strong> — bu kəşfin bütün bəşəriyyətə aid olduğunu söylədi.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Hansı qaz "istixana effekti"nin əsas səbəbidir?',a:['Azot','Oksigen','Karbon dioksid','Arqon'],c:2,
f:{t:'Sənaye inqilabından bəri CO₂ 50% artıb',x:'<strong>Karbon dioksid (CO₂)</strong> istixana effektinin əsas səbəbidir. Sənaye inqilabından bəri atmosferdəki CO₂ miqdarı <strong>50% artmışdır</strong>. Son 100 ildəki temperatur artımı əvvəlki <strong>10.000 ilin artımından</strong> çoxdur.',i:'https://images.unsplash.com/photo-1532094349884-543559451726?w=900&q=80'}},

{q:'Atom bombası hansı prinsipə əsaslanır?',a:['Sintez','Parçalanma (fissiya)','Yanma','İonlaşma'],c:1,
f:{t:'Atom bombası — 1 kq uraniumdan şəhər məhv edilir',x:'Atom bombası <strong>nüvə fissiyasına</strong> (parçalanmasına) əsaslanır. 1 kq uranium tamamilə parçalananda <strong>Hirosima partlayışı gücündə</strong> enerji ayrılır. Termonüvə bombası isə fissiya + füzyon prinsipinə əsaslanır.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Kainatın yaşı neçədir?',a:['8 milyard il','10 milyard il','13,8 milyard il','20 milyard il'],c:2,
f:{t:'Kainatda 2 trilyon qalaktika var',x:'Kainatın yaşı <strong>13,8 milyard ildir</strong>. Bu müddəti 1 il kimi düşünsək, bütün insan tarixi <strong>son 10 saniyəyə</strong> sığar. Görünən kainatda <strong>2 trilyon qalaktika</strong> var — hər birinin milyardlarla ulduzu.',i:'https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=900&q=80'}},

{q:'İnsan bədənindəki neçə sümük var?',a:['106','206','306','406'],c:1,
f:{t:'Körpədə 270, böyükdə 206 sümük olur',x:'Yetkin insanda <strong>206 sümük</strong> var. Lakin körpə <strong>270-ə qədər</strong> sümüklə doğulur — böyüdükcə bəziləri birləşir. Ən möhkəm sümük diş minası — Yer üzündəki ən bərk toxumadır.',i:'https://images.unsplash.com/photo-1559757175-0eb30cd8c063?w=900&q=80'}},

{q:'Günəşin yaşı təxminən neçədir?',a:['1 milyard il','4,6 milyard il','10 milyard il','13,8 milyard il'],c:1,
f:{t:'Günəş ömrünün yarısını yaşayıb',x:'Günəşin yaşı <strong>4,6 milyard ildir</strong>. Ömrü 10 milyard il olacaq — yəni hələ <strong>5,4 milyard ili</strong> qalır. Ömrünün sonunda <strong>Yeri udacaq qədər</strong> böyüyəcək! Biz burada olmarıq.',i:'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?w=900&q=80'}},

{q:'İnsan DNT-si neçə cüt xromosom daşıyır?',a:['20','23','25','46'],c:1,
f:{t:'İnsan DNT-si 2 metrdir — hər hüceyrədə!',x:'İnsan hüceyrəsində <strong>23 cüt (46) xromosom</strong> var. Bir hüceyrədəki DNT uzadılsa <strong>2 metr</strong> olur. Bütün bədəndəki DNT uzadılsa Günəşə gedib qayıdar — <strong>müalicəsiz geri gəlmək üçün!</strong>',i:'https://images.unsplash.com/photo-1628595351029-c2bf17511435?w=900&q=80'}},

// ── TARİX ──
{q:'Azərbaycan müstəqilliyini neçənci ildə bərpa etdi?',a:['1989','1990','1991','1992'],c:2,
f:{t:'18 oktyabr 1991 — 73 illik sovet dövrü sona çatdı',x:'<strong>18 oktyabr 1991-ci ildə</strong> Azərbaycan müstəqilliyini bərpa etdi. 73 illik Sovet dövrü sona çatdı. 1918-ci ilki Azərbaycan Xalq Cümhuriyyəti süqutundan sonra <strong>xalqın arzusu yerinə yetdi.</strong>',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'İkinci Dünya Müharibəsi neçənci ildə başladı?',a:['1937','1938','1939','1940'],c:2,
f:{t:'1 sentyabr 1939 — Almaniya Polşanı işğal etdi',x:'İkinci Dünya Müharibəsi <strong>1 sentyabr 1939-cu ildə</strong> Almaniyanın Polşanı işğal etməsi ilə başladı. <strong>70 milyondan</strong> çox insan həlak oldu — tarixin ən dağıdıcı münaqişəsi.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Fransız İnqilabı neçənci ildə baş verdi?',a:['1776','1789','1799','1804'],c:1,
f:{t:'14 iyul 1789 — Bastiliya əldə edildi',x:'Fransız İnqilabı <strong>14 iyul 1789-cu ildə</strong> Bastiliya həbsxanasının ələ keçirilməsi ilə başladı. "Azadlıq, Bərabərlik, Qardaşlıq" şüarı doğuldu. Bu gün <strong>14 iyul Fransanın milli bayramıdır.</strong>',i:'https://images.unsplash.com/photo-1502602898657-3e91760cbb34?w=900&q=80'}},

{q:'Xristofor Kolumb Amerikanı neçənci ildə kəşf etdi?',a:['1488','1490','1492','1498'],c:2,
f:{t:'Kolumb ömrü boyunca Hindistana çatdığını düşündü',x:'<strong>12 oktyabr 1492-ci ildə</strong> Kolumb Karib adalarına çatdı. Ömrünün sonuna qədər <strong>Hindistana çatdığını</strong> düşündü! "Amerika" adı isə başqa bir italyan dənizçidən — Amerigo Vespuçidən gəlir.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Osmanlı imperiyası neçənci ildə süqut etdi?',a:['1919','1920','1922','1923'],c:2,
f:{t:'Osmanlı imperiyası 623 il yaşadı',x:'Osmanlı imperiyası <strong>1 noyabr 1922-ci ildə</strong> süqut etdi. <strong>623 il</strong> mövcud oldu — tarihin ən uzun ömürlü imperiyalarından biri. 3 qitəyə — Avropa, Asiya, Afrika — yayılmışdı.',i:'https://images.unsplash.com/photo-1524231757912-21f4fe3a7200?w=900&q=80'}},

{q:'Birinci Dünya Müharibəsi neçənci ildə sona çatdı?',a:['1916','1917','1918','1919'],c:2,
f:{t:'11-ci ayın 11-i, saat 11 — sülh',x:'Birinci Dünya Müharibəsi <strong>11 noyabr 1918-ci ildə, saat 11-də</strong> sona çatdı. Bu simvolik vaxt qərarlı seçilmişdi. <strong>20 milyondan</strong> çox insan həlak oldu.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Sovet İttifaqı neçənci ildə dağıldı?',a:['1989','1990','1991','1992'],c:2,
f:{t:'25 dekabr 1991 — SSRİ bayrağı endiridi',x:'Sovet İttifaqı <strong>25 dekabr 1991-ci ildə</strong> Mixail Qorbaçovun istefa ilə dağıldı. 15 müstəqil dövlət yarandı. <strong>70 illik ideologiya</strong> tarixə qovuşdu.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Azərbaycan Xalq Cümhuriyyəti neçənci ildə elan edildi?',a:['1917','1918','1919','1920'],c:1,
f:{t:'28 May 1918 — Şərqin ilk demokratiyası',x:'<strong>28 May 1918-ci ildə</strong> Azərbaycan Xalq Cümhuriyyəti elan edildi — müsəlman dünyasında <strong>ilk demokratik respublika!</strong> Dünyada ilk dəfə <strong>qadınlara oy hüququ</strong> tanıyan respublikalar arasındadır.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Berlin Divarı neçənci ildə yıxıldı?',a:['1987','1988','1989','1990'],c:2,
f:{t:'9 noyabr 1989 — Soğuq müharibənin simvolu yıxıldı',x:'<strong>9 noyabr 1989-cu ildə</strong> Berlin Divarı yıxıldı. 28 il şərq-qərbi ayıran bu divarın yıxılması <strong>Soyuq Müharibənin</strong> sona yaxınlaşmasını simvolizə edir. Yıxılma onu tikməkdən daha sürətli oldu.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Çin Səddi neçə km uzunluğundadır?',a:['3000 km','6000 km','21000 km','40000 km'],c:2,
f:{t:'Çin Səddi kosmosdan görünmür — bu şayiədir',x:'Çin Səddi bütün qollarla birlikdə <strong>21.196 km</strong> uzunluğundadır. Bir əfsanə: kosmosdan görünür — lakin bu <strong>yanlışdır!</strong> İnsansız kosmik aparatla da görünmür — çox nazikdir.',i:'https://images.unsplash.com/photo-1490457843367-34b21a6e6897?w=900&q=80'}},

{q:'NATO neçənci ildə yaradıldı?',a:['1945','1947','1949','1951'],c:2,
f:{t:'NATO 1949 — 4 aprel, Vaşinqton',x:'NATO <strong>4 aprel 1949-cu ildə</strong> Vaşinqtonda yaradıldı. Sovet təhdidlərinə qarşı Qərb ittifaqının əsasını qoydu. İlk üzvləri 12 ölkə idi — bu gün üzvlük <strong>32 ölkəyə</strong> çatmışdır.',i:'https://images.unsplash.com/photo-1461360228754-6e81c478b882?w=900&q=80'}},

{q:'Qədim Olimpiya oyunları hansı ölkədə keçirilirdi?',a:['Roma','Misir','Yunanıstan','Türkiyə'],c:2,
f:{t:'Qədim olimpiada 776 e.ə.-dən 393 m.-ə qədər davam etdi',x:'Qədim Olimpiya oyunları <strong>e.ə. 776-cı ildən</strong> başladı. <strong>1.169 il</strong> davam etdi! Roma imperatoru Teodosius 393-cü ildə "paqan" olaraq qadağan etdi. Müasir olimpiada 1896-dan yenidən başladı.',i:'https://images.unsplash.com/photo-1569517282132-25d22f4573e6?w=900&q=80'}},

{q:'İlk çap maşınını kim ixtira etdi?',a:['Leonardo da Vinçi','Qutenberq','Galileo','Nyuton'],c:1,
f:{t:'Qutenberq 1440 — kitab çapı sivilizasiyanı dəyişdirdi',x:'<strong>Yohannes Qutenberq</strong> 1440-cı ildə hərəkəthərfli çap maşını ixtira etdi. Bu ixtira <strong>Renessans, Reformasiya</strong> hərəkatlarını sürətləndirdi. Biliyin kütlələrə yayılmasının açarı oldu.',i:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=900&q=80'}},

{q:'Birinci atom bombası hansı şəhərə atıldı?',a:['Naqasaki','Tokio','Xirosima','Osaka'],c:2,
f:{t:'6 avqust 1945 — Xirosima — 80.000 nəfər ani ölüm',x:'<strong>6 avqust 1945-ci ildə</strong> "Little Boy" atom bombası Xirosimaya atıldı. Ani olaraq <strong>80.000 nəfər</strong> həlak oldu. Bu hadisə nüvə silahlarına qarşı ilk kütləvi sülh hərəkatını doğurdu.',i:'https://images.unsplash.com/photo-1580060839134-75a5edca2e99?w=900&q=80'}},

{q:'Novruz bayramı hansı tarixdə qeyd edilir?',a:['20 Mart','21 Mart','22 Mart','23 Mart'],c:1,
f:{t:'Novruz 3.000 illik tarixə malikdir — UNESCO mirası',x:'<strong>Novruz 21 Mart</strong>da — bahar günobərasında — qeyd edilir. <strong>3.000 ildən çox</strong> tarixə malikdir. UNESCO-nun Qeyri-Maddi Mədəni İrs siyahısındadır. <strong>300 milyondan</strong> çox insan qeyd edir.',i:'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=900&q=80'}},

{q:'Azərbaycan Respublikasının Konstitusiyası neçənci ildə qəbul edilib?',a:['1992','1993','1995','1996'],c:2,
f:{t:'12 noyabr 1995 — referendum yolu ilə qəbul edildi',x:'Azərbaycan Konstitusiyası <strong>12 noyabr 1995-ci ildə</strong> ümumxalq referendumu ilə qəbul edildi. <strong>158 maddədən</strong> ibarətdir. Müstəqil Azərbaycanın hüquqi əsasını formalaşdırdı.',i:'https://images.unsplash.com/photo-1589829545856-d10d557cf95f?w=900&q=80'}},

{q:'Azərbaycanda hər il 28 May nə günü kimi qeyd edilir?',a:['Müstəqillik günü','Respublika günü','Zəfər günü','Silahlı qüvvələr günü'],c:1,
f:{t:'28 May 1918 — müsəlman Şərqinin ilk demokratiyası',x:'<strong>28 May Respublika günüdür</strong> — 1918-ci ildəki Azərbaycan Xalq Cümhuriyyətinin elan günü. Müsəlman dünyasında <strong>ilk demokratik respublika!</strong> Həmçinin dünyada qadınlara oy hüququ tanıyan ilk respublikalar arasındadır.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Azərbaycan dilinin əlifbası hazırda hansı yazı sisteminə əsaslanır?',a:['Kiril','Latın','Ərəb','Yunan'],c:1,
f:{t:'Azərbaycan əlifbası 100 ildə 3 dəfə dəyişib',x:'Azərbaycan <strong>latın</strong> əlifbasından istifadə edir. Tarix boyu 3 fərqli yazı sistemi işlənib: <strong>ərəb → latın → kiril → latın.</strong> Son keçid 1991-dən sonra — müstəqilliklə — baş verdi.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Azərbaycanın milli valyutası nədir?',a:['Rubl','Manat','Lirə','Qrivna'],c:1,
f:{t:'Manat — "mənata" sözündən gəlir',x:'Azərbaycanın milli valyutası <strong>manat</strong>dır. 1 manat = 100 qəpik. <strong>2006-cı ildə</strong> yenilənmiş manat dövriyyəyə girdi. "Manat" sözü rus dilindəki "moneta" sözündən götürülüb.',i:'https://images.unsplash.com/photo-1497796742626-fe30f204ec54?w=900&q=80'}},

{q:'Azərbaycanın Dövlət bayrağında neçə rəng var?',a:['2','3','4','5'],c:1,
f:{t:'Mavi-Qırmızı-Yaşıl — hər rəngin öz mənası var',x:'Azərbaycan bayrağında <strong>3 rəng</strong> var: mavi (türk dünyası), qırmızı (müasirlik və demokratiya), yaşıl (islam). Mərkəzdəki <strong>hilal və səkkizguşəli ulduz</strong> türk xalqlarının simvoludur.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Azərbaycanın Dövlət himni müsiqisini kim bəstələmişdir?',a:['Üzeyir Hacıbəyov','Fikrət Əmirov','Qara Qarayev','Cahangir Cahangirov'],c:0,
f:{t:'Üzeyir Hacıbəyov — 1918-ci ildə bəstədi',x:'<strong>Üzeyir Hacıbəyov</strong> Azərbaycan Dövlət himninin musiqisini bəstələdi. Sözlərini <strong>Əhməd Cavad</strong> yazdı. Hacıbəyov həm də Şərqin ilk operasının — "Leyli və Məcnun" (1908) — müəllifidir.',i:'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=900&q=80'}},

{q:'Şuşa şəhəri 2021-ci ildə nə elan edildi?',a:['Turizm mərkəzi','Mədəniyyət paytaxtı','Azərbaycanın mədəni paytaxtı','Sənaye mərkəzi'],c:2,
f:{t:'Şuşa — Qarabağın tacı, muğamın beşiyi',x:'<strong>Şuşa</strong> 2021-ci ildə Azərbaycanın mədəni paytaxtı elan edildi. 44 günlük müharibədən sonra <strong>8 noyabr 2020-ci ildə</strong> azad edildi. "Qarabağın tacı" adlanan bu şəhər Azərbaycan muğamının beşiyidir.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Azərbaycanın birinci prezidenti kim olub?',a:['Heydar Əliyev','Əyaz Mütəllibov','Əbülfəz Elçibəy','İlham Əliyev'],c:1,
f:{t:'Əyaz Mütəllibov Azərbaycanın ilk prezidenti idi',x:'<strong>Əyaz Mütəllibov</strong> 1991-1992-ci illərdə Azərbaycanın ilk prezidenti oldu. Sonra <strong>Əbülfəz Elçibəy</strong>, ardından <strong>Heydər Əliyev</strong> prezident seçildi. Müstəqilliyin ilk illəri siyasi baxımdan çox gərgin keçdi.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Bakının tarixi mərkəzi necə adlanır?',a:['Əski şəhər','İçərişəhər','Köhnə şəhər','Qala'],c:1,
f:{t:'İçərişəhər 2.000 il yaşındadır — UNESCO mirası',x:'<strong>İçərişəhər</strong> Bakının tarixi qala divarları ilə əhatə olunmuş mərkəzidir. <strong>2.000 ildən</strong> artıq tarixi var. UNESCO Dünya İrsi siyahısındadır. Qız qalası, Şirvanşahlar sarayı burada yerləşir.',i:'https://images.unsplash.com/photo-1538300342682-cf57afb97285?w=900&q=80'}},

{q:'Azərbaycanda ilk neft neçənci ildə çıxarıldı?',a:['1848','1858','1868','1878'],c:0,
f:{t:'1848 — Pensilvaniyadan 11 il əvvəl dünya ilki',x:'Azərbaycanda ilk sənaye neft quyusu <strong>1848-ci ildə</strong> Bibi-Heybətdə açıldı. Bu, Pensilvaniyada (ABŞ) açılan quyudan <strong>11 il əvvəldir!</strong> Azərbaycan dünya neft sənayesinin beşiyidir.',i:'https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=900&q=80'}},

{q:'Azərbaycanda ilk teatr neçənci ildə açılmışdır?',a:['1850','1873','1898','1910'],c:1,
f:{t:'1873 — Bakıda Şərqin ilk Azərbaycandilli teatrı',x:'Azərbaycanda ilk teatr <strong>1873-cü ildə</strong> Bakıda açıldı — Şərqdə ilk Azərbaycan dilində professional teatr. İlk tamaşa Mirzə Fətəli Axundovun pyesi əsasında hazırlandı.',i:'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=900&q=80'}},

{q:'Üzeyir Hacıbəyovun ilk operasının adı nədir?',a:['Koroğlu','Leyli və Məcnun','Arşın mal alan','O olmasın, bu olsun'],c:1,
f:{t:'Leyli və Məcnun 1908 — bütün Şərqin ilk operası',x:'<strong>Üzeyir Hacıbəyov</strong>un 1908-ci ildə bəstələdiyi "Leyli və Məcnun" operası bütün müsəlman Şərqinin <strong>ilk operasıdır!</strong> Bu əsər Şərq musiqisi ilə Qərb opera formasını ustalıqla birləşdirir.',i:'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=900&q=80'}},

{q:'"Dədə Qorqud" dastanı hansı dildə yazılmışdır?',a:['Ərəb','Fars','Türk (Azərbaycan)','Gürcü'],c:2,
f:{t:'Dədə Qorqud UNESCO mirası — 12 qəhrəmanlıq dastanı',x:'"<strong>Dədə Qorqud</strong>" dastanları qədim Azərbaycan türkcəsində yazılmışdır. <strong>12 qəhrəmanlıq boyundan</strong> ibarətdir. UNESCO Qeyri-Maddi Mədəni İrs siyahısındadır.',i:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=900&q=80'}},

{q:'İkinci Qarabağ müharibəsi neçə gün davam etdi?',a:['27','44','60','90'],c:1,
f:{t:'44 günlük müharibə — Şuşa 8 noyabrda azad edildi',x:'İkinci Qarabağ müharibəsi <strong>44 gün</strong> davam etdi (27 sentyabr — 10 noyabr 2020). Tarixi qələbə ilə <strong>Şuşa 8 noyabrda</strong> azad edildi. Bu müharibə müasir döyüş texnologiyalarının yeni çağını simvolizə etdi.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'"Romeo və Cülyetta" əsərinin müəllifi kimdir?',a:['Çarlz Dikkens','Lev Tolstoy','Uilyam Şekspir','Höte'],c:2,

f:{t:'Ada Lavleys — 1843-cü ildə ilk alqoritm',x:'<strong>Ada Lavleys</strong> (1815-1852) dünyada ilk kompüter proqramçısı sayılır. 1843-cü ildə <strong>ilk alqoritm</strong> yazdı — kompüter hələ mövcud olmamışdan əvvəl! Ada prоqramlaşdırma dilinin adı onun şərəfinədir.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'İlk iPhone neçənci ildə təqdim edildi?',a:['2005','2006','2007','2008'],c:2,
f:{t:'9 yanvar 2007 — Steve Jobs: "Telefonu yenidən ixtira edirik"',x:'<strong>Steve Jobs</strong> 9 yanvar 2007-ci ildə ilk iPhone-u təqdim etdi. Nokia CEO-su "Bu heç iş görməz" dedi — şirkəti sonra iflas etdi. Hazırkı iPhonelar ilk modeldan <strong>milyonlarla dəfə güclüdür.</strong>',i:'https://images.unsplash.com/photo-1523206489230-c012c64b2b48?w=900&q=80'}},

{q:'Ən çox istifadə edilən axtarış motoru hansıdır?',a:['Bing','Yahoo','Google','DuckDuckGo'],c:2,
f:{t:'Google gündə 8,5 milyard axtarış emal edir',x:'<strong>Google</strong> gündə <strong>8,5 milyard axtarış</strong> emal edir. İnternetin 90%-dən çox axtarış payını tutur. "Google" sözü rəqəm olan "googol" (10¹⁰⁰) sözündən gəlir.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'CPU nə deməkdir?',a:['Central Processing Unit','Computer Power Unit','Core Processing Unit','Central Power Unit'],c:0,
f:{t:'CPU — ilk transistoru 2.300 idi, indi 100 milyard',x:'CPU = <strong>Central Processing Unit</strong>. 1971-ci ilki ilk Intel prosessoru cəmi <strong>2.300 transistordan</strong> ibarəti idi. Bugünkü prosessorlar <strong>100 milyard-dan çox</strong> transistor saxlayır!',i:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80'}},

{q:'Sosial media platforması Facebook neçənci ildə yaradıldı?',a:['2002','2003','2004','2005'],c:2,
f:{t:'Zuckerberg Facebook-u Harvard yataqxanasında yaratdı',x:'<strong>Mark Zuckerberg</strong> 2004-cü ildə Harvardda Facebook-u yaratdı. İlk gün <strong>1.200 tələbə</strong> qeydiyyatdan keçdi. Bugün <strong>3 milyarddan</strong> çox aktiv istifadəçisi var.',i:'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=900&q=80'}},

{q:'USB nəyin qısaltmasıdır?',a:['Universal Serial Bus','Universal System Base','United Serial Board','Universal Speed Bridge'],c:0,
f:{t:'USB 1996-da yarandı — əvvəl hər cihazın fərqli kabeli var idi',x:'USB = <strong>Universal Serial Bus</strong>. 1996-cı ildə standartlaşdırıldı. Bundan əvvəl hər cihaz — printer, klaviatura, siçan — <strong>fərqli kabel və port</strong> tələb edirdi. USB hər şeyi birləşdirdi.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'Python nədir?',a:['İlan növü','Proqramlaşdırma dili','Avadanlıq','Antivirus'],c:1,
f:{t:'Python — Gido van Rossum yılbaşı tətilində yazdı',x:'<strong>Python</strong> proqramlaşdırma dilidir. <strong>Gido van Rossum</strong> 1989-cu ildə yılbaşı tətilindəki könüllü iş olaraq yazmağa başladı. Bu gün dünyanın ən populyar proqramlaşdırma dilindən biridir.',i:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80'}},

{q:'RAM nə deməkdir?',a:['Random Access Memory','Read All Memory','Rapid Access Module','Read Access Memory'],c:0,
f:{t:'RAM kompüter söndükdə tamamilə silinir',x:'RAM = <strong>Random Access Memory</strong>. Kompüter söndükdə RAM-dakı bütün məlumat <strong>tamamilə silinir!</strong> 1980-ci illərdə 64KB RAM normaldı. Bugün <strong>32-64 GB RAM</strong> adi sayılır — 500.000 dəfə artıq!',i:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80'}},

{q:'Hansı şirkət "Android" əməliyyat sistemini yaratdı?',a:['Apple','Microsoft','Google','Samsung'],c:2,
f:{t:'Android əvvəlcə kamera üçün nəzərdə tutulmuşdu',x:'<strong>Google</strong> Android-i 2008-ci ildə bazara çıxardı. Maraqlı tarix: Android əvvəlcə <strong>kamera üçün</strong> nəzərdə tutulmuşdu — sonra smartfona yönəldildi! Bu gün dünya smartfonlarının <strong>72%-i</strong> Android işlədir.',i:'https://images.unsplash.com/photo-1523206489230-c012c64b2b48?w=900&q=80'}},

{q:'İnternetin əcdadı hesab olunan şəbəkə hansıdır?',a:['ARPANET','BITNET','USENET','NSFNET'],c:0,
f:{t:'ARPANET — ilk mesaj sadəcə "LO" oldu',x:'<strong>ARPANET</strong> 1969-cu ildə ABŞ müdafiə nazirliyi tərəfindən yaradıldı. İlk göndərilən mesaj "login" idi — lakin sistem <strong>çöküb yalnız "LO" çatdırdı!</strong> Bu iki hərf internetin ilk sözüdür.',i:'https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=900&q=80'}},

{q:'Hansı proqramlaşdırma dili ən çox istifadə edilir?',a:['Java','C++','Python','JavaScript'],c:3,
f:{t:'JavaScript — hər brauzerdə işləyir',x:'<strong>JavaScript</strong> 2024-cü ildə ən geniş istifadə olunan proqramlaşdırma dilidir. 1995-ci ildə Brendan Eich tərəfindən cəmi <strong>10 gündə yaradıldı!</strong> Hər vebsayt JavaScript işlədir.',i:'https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=900&q=80'}},

{q:'"Bitcoin" kriptovalyutasını kim yaratdı?',a:['Elon Musk','Satoshi Nakamoto','Jeff Bezos','Vitalik Buterin'],c:1,
f:{t:'Satoshi Nakamoto — kimliyini heç kim bilmir',x:'<strong>Satoshi Nakamoto</strong> Bitcoin-i 2009-cu ildə yaratdı. Amma bu <strong>real bir insanın adı deyil</strong> — yaxud bir qrup insandır. Kimliyi bu günə qədər <strong>sirr olaraq qalır!</strong> 1 milyon Bitcoini olduğu güman edilir.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

{q:'Hansı şirkət "ChatGPT"ni yaratdı?',a:['Google','Meta','OpenAI','Microsoft'],c:2,
f:{t:'ChatGPT 5 gündə 1 milyon istifadəçi qazandı',x:'<strong>OpenAI</strong> şirkəti ChatGPT-ni 2022-ci ilin noyabrında buraxdı. Cəmi <strong>5 gündə 1 milyon istifadəçi</strong> topladı — bu sürət tarixdə görünməmişdi! Netflix bu həddə çatmaq üçün <strong>3,5 il</strong> gözləmişdi.',i:'https://images.unsplash.com/photo-1558494949-ef010cbdcc31?w=900&q=80'}},

// ── RİYAZİYYAT ──
{q:'π (pi) ədədinin ilk üç rəqəmi hansıdır?',a:['3,12','3,14','3,16','3,18'],c:1,
f:{t:'Pi — hər il 14 mart dünyada "Pi günü" qeyd edilir',x:'Pi = <strong>3,14159265...</strong> — sonsuz, qeyri-dövri ədəd. Hər il <strong>14 mart</strong> (3/14) "Pi günü" kimi qeyd edilir. <strong>100 trilyon rəqəmi</strong> hesablanmışdır. Çevrənin diametrə nisbətidir.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'1-dən 10-a qədər ədədlərin cəmi nə qədərdir?',a:['45','50','55','60'],c:2,
f:{t:'Cəm = 55 — Qaus 10 yaşında bunu anında hesabladı',x:'1-dən 10-a qədər ədədlərin cəmi <strong>55-dir.</strong> Əfsanəyə görə 10 yaşlı <strong>Karl Qaus</strong> 1-dən 100-ə qədər cəmi bir neçə saniyədə hesabladı: n×(n+1)/2 formulundan istifadə etdi.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Üçbucağın daxili bucaqlarının cəmi neçə dərəcədir?',a:['90°','120°','180°','360°'],c:2,
f:{t:'180° — ancaq düz səthdə! Sferik üçbucaqda fərqlidir',x:'Düz səthdəki üçbucağın daxili bucaqları cəmi <strong>180°-dir</strong>. Amma sferik səthdə — məsələn, Yer kürəsinin üzərində — üçbucağın bucaqları cəmi <strong>180°-dən çox</strong> ola bilər!',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Fibonacci ardıcıllığında 8-dən sonra gələn ədəd hansıdır?',a:['10','12','13','15'],c:2,
f:{t:'Fibonacci 1,1,2,3,5,8,13... — təbiətdə hər yerdə',x:'Fibonacci sırası: 1,1,2,3,5,8,<strong>13</strong>,21... Heyrətamiz fakt: gül ləçəklərinin sayı, qabıq spiralları, galaktika kolları hər yerdə Fibonacci ədədlərini izləyir!',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'Hansı ədəd həm cüt həm də sadədir?',a:['1','2','3','4'],c:1,
f:{t:'2 — yeganə cüt sadə ədəd',x:'<strong>2</strong> həm cüt, həm sadədir — bu xüsusiyyətə malik <strong>yeganə ədəd!</strong> İnternet şifrələmə sistemlərinin (RSA) əsasını böyük sadə ədədlər təşkil edir — bu olmasa, onlayn bankçılıq mümkünsüz olardı.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'100-ün kvadrat kökü nədir?',a:['5','8','10','12'],c:2,
f:{t:'Kvadrat kök — babilonlular 3.600 il əvvəl bilirdilər',x:'100-ün kvadrat kökü <strong>10-dur</strong>. Maraqlı tarix: <strong>Babilonlular</strong> kvadrat kökü e.ə. 1600 illərdə gil lövhələrə yazırdılar. √2 = 1,41421... onların hesablamasında da bu dəqiqliqdə idi!',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'"Qızıl nisbət" hansı rəqəmə bərabərdir?',a:['1,414','1,618','2,718','3,141'],c:1,
f:{t:'Qızıl nisbət gözəlliyin riyazi sirri',x:'Qızıl nisbət <strong>φ = 1,618...</strong> Parthenon, Mona Liza, nautilus qabığı, insan üzündəki nisbətlər — hamısında var! Leonardo da Vinçi bu nisbəti <strong>"ilahi nisbət"</strong> adlandırırdı.',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

{q:'e (Eyler ədədi) təxminən nə qədərdir?',a:['1,618','2,718','3,141','4,669'],c:1,
f:{t:'e — bankçılıqdakı faiz artımının əsasıdır',x:'Eyler ədədi <strong>e ≈ 2,71828...</strong> Bankçılıqdakı mürəkkəb faiz artımının riyazi əsasıdır. Böyük Eyler identikliyi: <strong>e^(iπ)+1=0</strong> — bu düsturda riyaziyyatın beş ən vacib ədədi var!',i:'https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=900&q=80'}},

// ── AZƏRBAYCAN ──
{q:'Azərbaycanın milli marşının sözlərini kim yazmışdır?',a:['Üzeyir Hacıbəyov','Əhməd Cavad','Hüseyn Cavid','Cəlil Məmmədquluzadə'],c:1,
f:{t:'Əhməd Cavad — marş sözlərinin müəllifi, şair',x:'<strong>Əhməd Cavad</strong> Azərbaycan Dövlət Himninin sözlərini yazmışdır. <strong>Üzeyir Hacıbəyov</strong> musiqisini bəstəlayib. Əhməd Cavad 1918-ci ilki AXC dövründə aktiv şair idi.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Azərbaycanda ilk neft şirkəti neçənci ildə yaradıldı?',a:['1871','1879','1883','1891'],c:1,
f:{t:'1879 — Nobel qardaşları Bakıda neft şirkəti yaratdı',x:'<strong>1879-cu ildə</strong> Nobel qardaşları (Alfredlə eyni ailə!) Bakıda "Branobel" neft şirkəti yaratdı. Bu, Bakı neft sənayesinin <strong>qlobal miqyasda</strong> böyüməsini sürətləndirdi.',i:'https://images.unsplash.com/photo-1511884642898-4c92249e20b6?w=900&q=80'}},

{q:'Azərbaycanda hansı şəhər ipək istehsalı ilə məşhurdur?',a:['Gəncə','Şuşa','Şəki','Lənkəran'],c:2,
f:{t:'Şəki — 1.000 ildir ipək istehsal edir',x:'<strong>Şəki</strong> 1.000 ildən artıqdır ipək istehsal edir. Məşhur <strong>Şəki halvası</strong> da bu şəhərdəndir. Xan Sarayının şüşəbənd pəncərə mozaikası zərif ipəkçilik sənəti kimi qorunur.',i:'https://images.unsplash.com/photo-1538300342682-cf57afb97285?w=900&q=80'}},

{q:'Azərbaycan bayrağındakı ay və ulduz nəyi simvolizə edir?',a:['Torpaq və göy','İslam dini','Dövlət müstəqilliyi','Türk xalqları'],c:1,
f:{t:'Hilal müsəlman dünyasının, ulduz türk xalqlarının simvoludur',x:'Azərbaycan bayrağındakı <strong>hilal (ay)</strong> İslam dinini simvolizə edir. <strong>8 guşəli ulduz</strong> isə türk xalqlarını. 1918-ci ildə AXC dövrünün bayrağından qalmış bu dizayn müstəqillikdən sonra yenidən qəbul edildi.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'Bakıdakı "Qız qalası" neçənci əsrə aiddir?',a:['VI-VII','VIII-IX','XI-XII','XIII-XIV'],c:2,
f:{t:'Qız qalası 2.000 il tarixə malik UNESCO mirası',x:'<strong>Qız qalası</strong> XI-XII əsrlərə aid olduğu ehtimal edilir. UNESCO Dünya İrsi siyahısındadır. Qalanın 8 mərtəbəsi var, divarlrın qalınlığı <strong>5 metrdir.</strong> İçindəki nə iş üçün işlədildiyi hələ tam öyrənilməyib.',i:'https://images.unsplash.com/photo-1538300342682-cf57afb97285?w=900&q=80'}},

{q:'Azərbaycanın ən böyük su anbarı hansıdır?',a:['Mingəçevir','Şamkir','Araz','Varvara'],c:0,
f:{t:'Mingəçevir su anbarı — Azərbaycanın enerji qalası',x:'<strong>Mingəçevir</strong> su anbarı Azərbaycanın ən böyük su anbarıdır. 1954-cü ildə tamamlandı. Kür çayı üzərindədir. Azərbaycanın elektrik enerjisinin böyük hissəsini <strong>Mingəçevir HES</strong> istehsal edir.',i:'https://images.unsplash.com/photo-1439066615861-d1af74d74000?w=900&q=80'}},

{q:'Azərbaycanda muğamın neçə əsas növü var?',a:['5','7','9','12'],c:3,
f:{t:'12 muğam — Azərbaycanın musiqi xəzinəsi',x:'Azərbaycan muğamının <strong>12 əsas növü</strong> var: Rast, Şur, Segah, Çahargah, Bayatı-Şiraz, Şüştər, Homayun, Şahnaz, Sarənc, Chahargah-Hicaz, Bayatı-Kürd, Rahab. UNESCO mirası!',i:'https://images.unsplash.com/photo-1507838153414-b4b713384a76?w=900&q=80'}},

{q:'Azərbaycanın milli bayrağının rənglərinin sırası necədir?',a:['Yaşıl-Qırmızı-Mavi','Mavi-Qırmızı-Yaşıl','Qırmızı-Yaşıl-Mavi','Mavi-Yaşıl-Qırmızı'],c:1,
f:{t:'Üç rəng: mavi, qırmızı, yaşıl',x:'Azərbaycan bayrağının rənglərinin sırası <strong>mavi-qırmızı-yaşıl</strong>dir (yuxarıdan aşağı). <strong>Mavi</strong> türk dünyasını, <strong>qırmızı</strong> müasirliyi, <strong>yaşıl</strong> İslam dinini simvolizə edir.',i:'https://images.unsplash.com/photo-1583394838336-acd977736f90?w=900&q=80'}},

{q:'"Kitabi-Dədə Qorqud" neçənci əsrə aiddir?',a:['V-VI','VII-VIII','IX-XI','XII-XIII'],c:2,
f:{t:'Dədə Qorqud — türk xalqlarının ən qədim dastanı',x:'"<strong>Kitabi-Dədə Qorqud</strong>" IX-XI əsrlərə aid hesab edilir. Türk xalqlarının ən qədim dastanlarından biridir. Drezden, Vatikan və Türkiyə kitabxanalarında qorunur. UNESCO mirası.',i:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=900&q=80'}},

{q:'Cəlil Məmmədquluzadənin qələmə aldığı "Ölülər" nə janrındadır?',a:['Roman','Hekayə','Dram','Poema'],c:2,
f:{t:'"Ölülər" — Azərbaycan dramaturgiyasının şedevri',x:'<strong>Cəlil Məmmədquluzadə</strong>nin "Ölülər" <strong>dramıdır</strong> (pyesdir). 1909-cu ildə yazılıb. Geridəqalmışlığı, fanatizmi, cəhaləti satirik şəkildə tənqid edir. Azərbaycan dramaturgiyasının ən mühüm əsərlərindən sayılır.',i:'https://images.unsplash.com/photo-1481627834876-b7833e8f5570?w=900&q=80'}},

{q:'Azərbaycanın ən böyük gölü hansıdır?',a:['Göygöl','Sarısu','Ağgöl','Hacıqabul gölü'],c:1,
f:{t:'Sarısu gölü Azərbaycanın ən böyük gölüdür',x:'<strong>Sarısu gölü</strong> Azərbaycanın ən böyük gölüdür. <strong>Göygöl</strong> isə ən məşhur gölüdür — 1139-cu ildə zəlzələ zamanı yaranmışdır! Göygölün mənasında "göy rəngli göl" var.',i:'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=900&q=80'}},

{q:'Azərbaycanın hansı şəhəri "Xan şəhəri" adlanır?',a:['Şəki','Şuşa','Gəncə','Naxçıvan'],c:0,
f:{t:'Şəki — XVIII əsr Şəki xanlığının paytaxtı',x:'<strong>Şəki</strong> "Xan şəhəri" adlanır. XVIII əsrdə Şəki xanlığının paytaxtı olub. <strong>Xan Sarayı</strong> rəngli şüşə mozaikası ilə məşhurdur — heç bir yapışdırıcı işlənməyib! UNESCO mirası siyahısındadır.',i:'https://images.unsplash.com/photo-1538300342682-cf57afb97285?w=900&q=80'}},

{q:'Azərbaycanda Novruz neçə gün qeyd edilir?',a:['1 gün','3 gün','7 gün','13 gün'],c:1,
f:{t:'Novruz 3 gün — lakin hazırlıq həftələr əvvəl başlayır',x:'Rəsmi olaraq Novruz <strong>3 gün</strong> qeyd edilir. Lakin bayrama hazırlıq — çərşənbələr, xonça, səməni — <strong>aylar əvvəl</strong> başlayır. Böyük Çərşənbə — Novruz axşamı — ən mühüm ənənədir.',i:'https://images.unsplash.com/photo-1518998053901-5348d3961a04?w=900&q=80'}},

// ── COĞRAFIYA 2 ──
{q:'Braziliyanın paytaxtı hansıdır?',a:['Rio-de-Janeyro','San-Paulo','Braziliya','Salvador'],c:2,
f:{t:'Braziliya şəhəri 1960-da sıfırdan tikildi',x:'Braziliyanın paytaxtı <strong>Braziliya şəhəridir</strong> — Rio deyil! <strong>1960-cu ildə</strong> sıfırdan planlı şəkildə tikildi. 1.000 km daxildə, dənizə çıxışı yoxdur. UNESCO-nun dünya irsinə daxildir.',i:'https://images.unsplash.com/photo-1483729558449-99ef09a8c325?w=900&q=80'}},

{q:'Yaponiya neçə adadan ibarətdir (əsas)?',a:['2','3','4','5'],c:2,
f:{t:'4 əsas ada — 6.852 ada toplumu',x:'Yaponiyanın <strong>4 əsas adası</strong> var: Honşu, Hokkaydo, Kyuşu, Şikoku. Lakin ümumilikdə <strong>6.852 ada</strong>sı mövcuddur! Yaponiyanın əhalisinin 98%-i bu 4 əsas adada yaşayır.',i:'https://images.unsplash.com/photo-1480796927426-f609979314bd?w=900&q=80'}},

{q:'Hansı ölkənin paytaxtı "Naypyidav"dır?',a:['Tailand','Myanma','Kamboca','Vyetnam'],c:1,
