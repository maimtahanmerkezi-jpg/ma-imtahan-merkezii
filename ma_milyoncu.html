<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',sans-serif;background:#f0f5ff;color:#0a1e50;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden}
.bg1{position:fixed;width:600px;height:600px;background:radial-gradient(circle,rgba(24,82,240,0.12)0%,transparent 70%);top:-200px;right:-150px;pointer-events:none;z-index:0}
.bg2{position:fixed;width:500px;height:500px;background:radial-gradient(circle,rgba(24,82,240,0.08)0%,transparent 70%);bottom:-150px;left:-100px;pointer-events:none;z-index:0}
.wrap{width:100%;max-width:720px;padding:24px 16px;position:relative;z-index:1}
#startScreen{text-align:center;padding:40px 20px}
.logo-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(24,82,240,0.1);border:1px solid rgba(24,82,240,0.3);color:#1852f0;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;padding:7px 18px;border-radius:100px;margin-bottom:20px}
.game-title{font-size:clamp(32px,7vw,60px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:10px;color:#0a1e50}
.blue{color:#1852f0}.amber{color:#f5a623}
.game-sub{font-size:15px;font-weight:300;color:rgba(10,30,80,0.55);margin-bottom:8px}
.q-count-badge{display:inline-block;background:rgba(24,82,240,0.08);border:1px solid rgba(24,82,240,0.2);color:#1852f0;font-size:12px;font-weight:600;padding:5px 14px;border-radius:100px;margin-bottom:28px}
.start-btn{height:54px;padding:0 48px;background:#1852f0;border:none;border-radius:14px;font-size:17px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;transition:background .2s,transform .15s;box-shadow:0 4px 28px rgba(24,82,240,0.3)}
.start-btn:hover{background:#2d6aff;transform:translateY(-2px)}
.chips{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:28px}
.chip{background:rgba(24,82,240,0.06);border:1px solid rgba(24,82,240,0.15);color:rgba(10,30,80,0.65);font-size:12px;padding:7px 15px;border-radius:100px}
#gameScreen{display:none}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 4px}
.tb-logo{font-size:13px;font-weight:700;color:#1852f0}
.tb-info{font-size:12px;color:rgba(10,30,80,0.45)}
.progress-wrap{width:100%;height:4px;background:rgba(24,82,240,0.12);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:#1852f0;border-radius:2px;transition:width .5s ease}
.ladder{display:flex;flex-direction:column-reverse;gap:3px;margin-bottom:16px}
.l-row{display:flex;align-items:center;gap:10px;padding:5px 12px;border-radius:8px;border:1px solid transparent;transition:all .3s}
.l-row.active{background:rgba(24,82,240,0.1);border-color:rgba(24,82,240,0.4)}
.l-row.done{background:rgba(52,211,99,0.08);border-color:rgba(52,211,99,0.25)}
.l-num{font-size:11px;font-weight:700;color:rgba(10,30,80,0.25);width:20px;text-align:right}
.l-row.active .l-num{color:#1852f0}
.l-row.done .l-num{color:#16a34a}
.l-label{font-size:12px;font-weight:400;color:rgba(10,30,80,0.3)}
.l-row.active .l-label{color:#0a1e50;font-weight:700}
.l-row.done .l-label{color:#16a34a}
.q-box{background:#ffffff;border:1.5px solid rgba(24,82,240,0.2);border-radius:16px;padding:24px 22px;margin-bottom:14px;text-align:center;min-height:90px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 16px rgba(24,82,240,0.08)}
.q-text{font-size:clamp(15px,3vw,18px);font-weight:600;line-height:1.6;color:#0a1e50}
.jokers{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.joker-btn{height:36px;padding:0 18px;background:#ffffff;border:1.5px solid rgba(24,82,240,0.25);border-radius:100px;font-size:12px;font-weight:600;color:#1852f0;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;box-shadow:0 1px 6px rgba(24,82,240,0.08)}
.joker-btn:hover:not([disabled]){background:#1852f0;color:#fff;border-color:#1852f0}
.joker-btn[disabled]{opacity:.3;cursor:not-allowed}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.ans-btn{background:#ffffff;border:1.5px solid rgba(24,82,240,0.15);border-radius:12px;padding:14px 14px;font-size:clamp(13px,2.5vw,15px);font-weight:500;color:#0a1e50;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s;text-align:left;line-height:1.45;display:flex;align-items:flex-start;gap:8px;box-shadow:0 1px 6px rgba(24,82,240,0.06)}
.ans-btn:hover:not([disabled]):not(.hidden){background:#e8f0ff;border-color:#1852f0;transform:translateY(-1px)}
.ans-btn.correct{background:rgba(22,163,74,0.12)!important;border-color:#16a34a!important;color:#15803d!important}
.ans-btn.wrong{background:rgba(220,38,38,0.08)!important;border-color:#dc2626!important;color:#b91c1c!important}
.ans-btn.hidden{opacity:.15;pointer-events:none}
.ans-btn[disabled]{cursor:default}
.ans-letter{font-size:11px;font-weight:800;color:#1852f0;flex-shrink:0;margin-top:2px;min-width:14px}
.ans-btn.correct .ans-letter{color:#16a34a}
.ans-btn.wrong .ans-letter{color:#dc2626}
#endScreen{display:none;text-align:center;padding:40px 20px}
.end-emoji{font-size:64px;margin-bottom:16px}
.end-title{font-size:30px;font-weight:800;margin-bottom:8px;letter-spacing:-.02em;color:#0a1e50}
.end-score{font-size:16px;color:rgba(10,30,80,0.5);margin-bottom:12px;font-weight:300}
.end-msg{font-size:14px;color:rgba(10,30,80,0.45);margin-bottom:32px;line-height:1.7;max-width:360px;margin-left:auto;margin-right:auto}
.end-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.wa-btn{display:inline-flex;align-items:center;gap:8px;height:48px;padding:0 26px;background:#25d366;border:none;border-radius:12px;font-size:14px;font-weight:700;color:#fff;cursor:pointer;font-family:'Outfit',sans-serif;text-decoration:none;transition:transform .15s}
.wa-btn:hover{transform:translateY(-2px)}
.again-btn{height:48px;padding:0 26px;background:#ffffff;border:1.5px solid rgba(24,82,240,0.25);border-radius:12px;font-size:14px;font-weight:600;color:#1852f0;cursor:pointer;font-family:'Outfit',sans-serif;transition:all .2s}
.again-btn:hover{background:#1852f0;color:#fff}
.pool-info{font-size:11px;color:rgba(10,30,80,0.3);margin-top:10px}
</style>

var LETTERS=['A','B','C','D'];
var STORAGE_KEY='bmq_seen_v2';
var gameQuestions=[];
var cur=0,used50=false,usedSkip=false,usedAud=false,answered=false;

function shuffle(arr){var a=arr.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}

function pickQuestions(){
  var totalCount=ALL_QUESTIONS.length;
  var seen=[];
  try{var raw=localStorage.getItem(STORAGE_KEY);if(raw)seen=JSON.parse(raw);}catch(e){seen=[];}
  var available=[];
  for(var i=0;i<totalCount;i++){if(seen.indexOf(i)===-1)available.push(i);}
  if(available.length<12){
    seen=[];available=[];
    for(var i=0;i<totalCount;i++)available.push(i);
    try{localStorage.removeItem(STORAGE_KEY);}catch(e){}
  }
  var shuffled=shuffle(available);
  var chosen=shuffled.slice(0,12);
  var newSeen=seen.concat(chosen);
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(newSeen));}catch(e){}
  var result=[];
  for(var k=0;k<chosen.length;k++)result.push(ALL_QUESTIONS[chosen[k]]);
  return result;
}

function getPoolStatus(){
  var total=ALL_QUESTIONS.length;
  var seen=[];
  try{var raw=localStorage.getItem(STORAGE_KEY);if(raw)seen=JSON.parse(raw);}catch(e){}
  var remaining=total-seen.length;
  return {seen:seen.length,remaining:remaining,total:total};
}

function buildLadder(){
  var el=document.getElementById('ladder');el.innerHTML='';
  for(var i=0;i<12;i++){var row=document.createElement('div');row.className='l-row'+(i===cur?' active':i<cur?' done':'');row.id='lrow'+i;row.innerHTML='<span class="l-num">'+(i+1)+'</span><span class="l-label">Sual '+(i+1)+'</span>';el.appendChild(row);}
}
function updateLadder(){for(var i=0;i<12;i++){var row=document.getElementById('lrow'+i);if(!row)continue;row.className='l-row'+(i===cur?' active':i<cur?' done':'');}}

function renderQ(){
  var d=gameQuestions[cur];
  document.getElementById('qText').textContent=d.q;
  document.getElementById('levelLabel').textContent='Sual '+(cur+1)+' / 12';
  document.getElementById('progFill').style.width=((cur/12)*100)+'%';
  var box=document.getElementById('answers');box.innerHTML='';
  for(var i=0;i<d.a.length;i++){
    var btn=document.createElement('button');btn.className='ans-btn';btn.id='ans'+i;
    btn.innerHTML='<span class="ans-letter">'+LETTERS[i]+'</span>'+d.a[i];
    btn.onclick=(function(idx){return function(){checkAnswer(idx);};})(i);
    box.appendChild(btn);
  }
  answered=false;
  document.getElementById('j50').disabled=used50;
  document.getElementById('jSkip').disabled=usedSkip;
  document.getElementById('jAud').disabled=usedAud;
}

function checkAnswer(idx){
  if(answered)return;answered=true;
  var d=gameQuestions[cur];var btns=document.querySelectorAll('.ans-btn');
  for(var i=0;i<btns.length;i++)btns[i].disabled=true;
  if(idx===d.c){btns[idx].classList.add('correct');playCorrectSound();setTimeout(function(){cur++;if(cur>=12){showEnd(true);}else{updateLadder();renderQ();}},900);}
  else{btns[idx].classList.add('wrong');btns[d.c].classList.add('correct');playWrongSound();setTimeout(function(){showEnd(false);},1300);}
}

function use5050(){
  if(used50||answered)return;used50=true;document.getElementById('j50').disabled=true;
  var d=gameQuestions[cur];var wrong=[];
  for(var i=0;i<d.a.length;i++){if(i!==d.c)wrong.push(i);}
  wrong=shuffle(wrong);
  for(var j=0;j<2;j++){var el=document.getElementById('ans'+wrong[j]);if(el)el.classList.add('hidden');}
}

function useSkip(){
  if(usedSkip||answered)return;usedSkip=true;document.getElementById('jSkip').disabled=true;answered=true;
  setTimeout(function(){cur++;if(cur>=12){showEnd(true);}else{updateLadder();renderQ();}},300);
}

function useAudience(){
  if(usedAud||answered)return;usedAud=true;document.getElementById('jAud').disabled=true;
  var d=gameQuestions[cur];var cp=Math.floor(55+Math.random()*20);var rem=100-cp;
  var others=[];for(var i=0;i<d.a.length;i++){if(i!==d.c)others.push(i);}
  others=shuffle(others);var pcts=[0,0,0,0];pcts[d.c]=cp;
  for(var k=0;k<others.length;k++){if(k===others.length-1){pcts[others[k]]=Math.max(0,rem);}else{var p=Math.floor(Math.random()*rem*0.6);pcts[others[k]]=p;rem-=p;}}
  var btns=document.querySelectorAll('.ans-btn');
  for(var b=0;b<btns.length;b++){btns[b].innerHTML+='<span style="margin-left:auto;font-size:11px;color:rgba(10,30,80,0.45);font-weight:700;flex-shrink:0">'+pcts[b]+'%</span>';}
}

function showEnd(win){
  document.getElementById('gameScreen').style.display='none';document.getElementById('endScreen').style.display='block';
  if(win){playWinSound();document.getElementById('endEmoji').textContent='🎉';document.getElementById('endTitle').textContent='Təbrik edirik!';document.getElementById('endScore').textContent='Bütün 12 suala düzgün cavab verdiniz!';document.getElementById('endMsg').textContent='Siz həqiqi bilik sahibisiniz! MA İmtahan Mərkəzinə qeydiyyatdan keçib öz potensialınızı real imtahanda da sınayın.';}
  else{playWrongSound();document.getElementById('endEmoji').textContent='😔';document.getElementById('endTitle').textContent=(cur+1)+'-ci sualda dayandınız';document.getElementById('endScore').textContent=cur+' sualdan düzgün cavab verdiniz';document.getElementById('endMsg').textContent='Narahat olmayın! Yenidən cəhd edin — hər oyunda tamamilə fərqli suallar çıxır!';}
}

var audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,duration,type,vol){try{var ctx=getAudioCtx();var osc=ctx.createOscillator();var gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.type=type||'sine';osc.frequency.setValueAtTime(freq,ctx.currentTime);gain.gain.setValueAtTime(vol||0.3,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);osc.start(ctx.currentTime);osc.stop(ctx.currentTime+duration);}catch(e){}}
function playStartSound(){var notes=[[523,0.12],[659,0.12],[784,0.12],[1047,0.25],[880,0.1],[1047,0.35]];var t=0;notes.forEach(function(n){setTimeout(function(){playTone(n[0],n[1]+0.15,'triangle',0.35);},t);t+=n[1]*1000*0.85;});}
function playCorrectSound(){playTone(523,0.1,'sine',0.3);setTimeout(function(){playTone(659,0.1,'sine',0.3);},80);setTimeout(function(){playTone(784,0.1,'sine',0.3);},160);setTimeout(function(){playTone(1047,0.25,'sine',0.35);},240);}
function playWrongSound(){playTone(300,0.15,'sawtooth',0.3);setTimeout(function(){playTone(200,0.3,'sawtooth',0.25);},150);}
function playWinSound(){var melody=[523,659,784,1047,784,880,1047,1319];melody.forEach(function(f,i){setTimeout(function(){playTone(f,0.2,'triangle',0.3);},i*120);});}

function updatePoolInfo(){
  var s=getPoolStatus();
  var el=document.getElementById('poolInfo');
  if(el)el.textContent='Sual bazası: '+s.total+' sual · Görülən: '+s.seen+' · Qalan: '+s.remaining;
}

function startGame(){
  cur=0;used50=false;usedSkip=false;usedAud=false;answered=false;
  gameQuestions=pickQuestions();
  playStartSound();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('endScreen').style.display='none';
  document.getElementById('gameScreen').style.display='block';
  buildLadder();renderQ();
}
function restartGame(){
  document.getElementById('endScreen').style.display='none';
  document.getElementById('startScreen').style.display='block';
  updatePoolInfo();
}

updatePoolInfo();
</script>
